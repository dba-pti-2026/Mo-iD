<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — Quản lý hồ sơ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#040a1f;
  --bg-1:#0a2a7a;
  --bg-2:#123a8c;
  --bg-3:#1c5cff;
  --cyan:#20b6e0;
  --sidebar-bg:#ffffff;
  --sidebar-border:#eef1f8;
  --content-bg:#f3f6fc;
  --ink:#10162e;
  --ink-soft:#5c6584;
  --ink-faint:#8991ab;
  --success:#17a865;
  --success-bg:#e7f9f0;
  --warning:#d97b0a;
  --warning-bg:#fff4e2;
  --danger:#e0374a;
  --danger-bg:#fdeaec;
  --info-bg:#eaf1ff;
  --line:#eef1f8;
  --radius-lg:26px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow-lg:0 24px 60px -18px rgba(6,16,50,0.28);
  --shadow-sm:0 6px 20px -10px rgba(20,35,90,0.12);
}
*{box-sizing:border-box;}
html,body{min-height:100%;}
body{
  margin:0;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--content-bg);
  min-height:100vh;
  color:var(--ink);
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:rgba(28,92,255,0.28);border-radius:10px;}

/* ---------- 3D-style icon badges ---------- */
.ico{width:1.15em;height:1.15em;vertical-align:-0.22em;flex-shrink:0;}
.tree-guide{display:inline-block;width:20px;text-align:center;color:#c3d1fb;font-weight:400;letter-spacing:0;}
.tree-guide-elbow{color:#8fadf5;font-weight:700;}
.tree-table tbody tr td:first-child{border-left:2px solid transparent;}
.tree-table tbody tr:hover{background:#f8faff;}
.icon3d{
  width:80px;height:80px;border-radius:26px;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;margin:0 auto 18px;position:relative;overflow:hidden;
  box-shadow:0 18px 32px -12px var(--i3d-shadow,rgba(28,92,255,0.5)), inset 0 -8px 12px rgba(0,0,0,0.16), inset 0 6px 8px rgba(255,255,255,0.5);
}
.icon3d.sm{width:52px;height:52px;border-radius:18px;font-size:22px;margin:0;}
.icon3d::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.18) 28%, transparent 55%);
  pointer-events:none;
}
.icon3d::before{
  content:"";position:absolute;top:-30%;left:-10%;width:70%;height:60%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.65),transparent 70%);filter:blur(4px);pointer-events:none;
}
.icon3d.blue{background:radial-gradient(circle at 30% 25%,#8fc0ff,#1c5cff 55%,#0a3ec2 100%);--i3d-shadow:rgba(28,92,255,0.45);}
.icon3d.green{background:radial-gradient(circle at 30% 25%,#8ff2c3,#17c775 55%,#0a8a4d 100%);--i3d-shadow:rgba(23,199,117,0.4);}
.icon3d.orange{background:radial-gradient(circle at 30% 25%,#ffd8a3,#f0921e 55%,#c96a04 100%);--i3d-shadow:rgba(240,146,30,0.4);}
.icon3d.red{background:radial-gradient(circle at 30% 25%,#ffb0ba,#ea4a5c 55%,#b91f30 100%);--i3d-shadow:rgba(224,55,74,0.4);}
.icon3d.purple{background:radial-gradient(circle at 30% 25%,#d3b9ff,#8a5cf0 55%,#5a2ec7 100%);--i3d-shadow:rgba(138,92,240,0.4);}
.icon3d.gold{background:radial-gradient(circle at 30% 25%,#fff0b0,#f0c419 55%,#c69406 100%);--i3d-shadow:rgba(240,196,25,0.4);}
.icon3d svg{position:relative;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.18));}

/* ---------- LOGIN ---------- */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 15% 15%, rgba(32,182,224,0.18), transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(28,92,255,0.28), transparent 50%),
    linear-gradient(160deg,#040a1f 0%, #081b4d 38%, #0f3a8c 68%, #1c5cff 100%);
}
.login-wrap::after{
  content:"";position:absolute;left:0;bottom:0;width:560px;height:560px;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='70' height='70'><g fill='%2320b6e0' fill-opacity='0.55'><circle cx='4' cy='4' r='1.6'/><circle cx='35' cy='4' r='1.6'/><circle cx='66' cy='4' r='1.6'/><circle cx='4' cy='35' r='1.6'/><circle cx='35' cy='35' r='1.6'/><circle cx='66' cy='35' r='1.6'/><circle cx='4' cy='66' r='1.6'/><circle cx='35' cy='66' r='1.6'/><circle cx='66' cy='66' r='1.6'/></g></svg>");
  background-size:70px 70px;opacity:0.55;
  -webkit-mask-image:radial-gradient(circle at 0% 100%, black 0%, transparent 68%);
  mask-image:radial-gradient(circle at 0% 100%, black 0%, transparent 68%);
}
.login-card{position:relative;z-index:1;}
.login-card{
  display:flex;width:100%;max-width:980px;background:rgba(255,255,255,0.85);
  border:1px solid rgba(255,255,255,0.6);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);backdrop-filter:blur(30px);overflow:hidden;
}
.login-left{flex:1.1;padding:52px 48px;background:#eef1f6;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.brand-logo{width:40px;height:40px;flex-shrink:0;}
.brand-logo img{width:100%;height:100%;object-fit:contain;}
.brand-tag{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--bg-3);background:#e7edff;padding:3px 10px;border-radius:999px;}
h1.login-title{font-size:26px;margin:0 0 8px;color:var(--ink);letter-spacing:-0.01em;font-weight:800;}
.login-sub{color:var(--ink-soft);font-size:13.5px;line-height:1.5;margin-bottom:30px;max-width:380px;}
.field{margin-bottom:18px;}
.field label{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:7px;text-transform:uppercase;}
.field label a{color:var(--bg-3);font-weight:600;text-transform:none;letter-spacing:0;}
.input, select.input{
  width:100%;padding:13px 15px;border-radius:13px;border:1.5px solid #dfe6f7;
  background:#fff;font-size:14.5px;color:var(--ink);outline:none;transition:.15s;font-family:inherit;
}
.input:focus{border-color:var(--bg-3);box-shadow:0 0 0 4px rgba(28,92,255,0.12);}
.pw-wrap{position:relative;}
.pw-wrap .input{padding-right:42px;}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--ink-soft);font-size:16px;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin:14px 0 22px;}
.btn{
  border:none;cursor:pointer;font-weight:700;font-size:14px;border-radius:13px;
  padding:14px 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:.15s;letter-spacing:.01em;font-family:inherit;
}
.btn-primary{background:linear-gradient(135deg,#173f9e,var(--bg-3));color:#fff;box-shadow:0 12px 26px -10px rgba(28,92,255,0.55);}
.btn-primary:hover{filter:brightness(1.07);}
.btn-block{width:100%;}
.btn-ghost{background:#eef2fc;color:var(--bg-1);}
.btn-outline{background:#fff;border:1.5px solid #dbe3f7;color:var(--ink);}
.btn-success{background:linear-gradient(135deg,#0f9e63,var(--success));color:#fff;box-shadow:0 12px 26px -10px rgba(23,168,101,0.5);}
.btn-warning{background:linear-gradient(135deg,#c96a04,var(--warning));color:#fff;box-shadow:0 12px 26px -10px rgba(217,123,10,0.5);}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:10px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.hint-box{margin-top:26px;font-size:11.8px;line-height:1.6;color:var(--ink-soft);background:#fff;border:1px solid #e2e9fb;border-radius:13px;padding:12px 14px;}
.hint-box b{color:var(--bg-1);}
.login-right{
  flex:1;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#16215c 0%,#1c318f 55%,#1c4fd6 100%);
  padding:44px 42px;color:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;
}
.hero-shield{position:relative;z-index:2;width:230px;margin:0 auto 30px;align-self:center;animation:heroFloat 4.5s ease-in-out infinite;}
.hero-shield img{width:100%;display:block;animation:heroPulse 3.2s ease-in-out infinite;}
@keyframes heroFloat{0%,100%{transform:translateY(0px);}50%{transform:translateY(-14px);}}
@keyframes heroPulse{0%,100%{filter:drop-shadow(0 0 18px rgba(120,220,255,0.35)) drop-shadow(0 25px 30px rgba(3,10,40,0.45));}50%{filter:drop-shadow(0 0 34px rgba(120,220,255,0.6)) drop-shadow(0 25px 30px rgba(3,10,40,0.45));}}
.orb{position:absolute;border-radius:50%;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);}
.hero-icon{width:76px;height:76px;border-radius:22px;margin:0 auto 60px;background:rgba(255,255,255,0.14);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 20px 40px -12px rgba(0,0,0,0.4);}
.login-right h2{font-size:25px;margin:0 0 10px;font-weight:800;position:relative;z-index:2;line-height:1.3;}
.login-right p{font-size:13px;color:rgba(255,255,255,0.8);line-height:1.6;margin:0;max-width:340px;position:relative;z-index:2;}

/* ---------- APP SHELL (light content, glass blue sidebar) ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:270px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:hidden;
  background:linear-gradient(190deg,#0a1e4d 0%,#123a8c 55%,#1c5cff 130%);
  border-right:1px solid rgba(255,255,255,0.1);
  display:flex;flex-direction:column;padding:22px 18px;color:#fff;
  box-shadow:8px 0 30px -18px rgba(10,25,80,0.4);
}
.sidebar > *{position:relative;z-index:1;}
.sb-brand{display:flex;align-items:center;gap:9px;margin-bottom:22px;padding:0 4px;}
.sb-brand .brand-logo{width:34px;height:34px;background:#fff;border-radius:9px;padding:4px;box-shadow:0 6px 16px -6px rgba(0,0,0,0.4);}
.sb-brand span{font-weight:800;font-size:15px;color:#fff;}
.sb-brand small{display:block;font-size:9.5px;color:var(--cyan);font-weight:700;letter-spacing:.08em;}
.user-card{
  display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden;
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.22);
  border-radius:18px;padding:14px;margin-bottom:22px;backdrop-filter:blur(16px);
  box-shadow:0 10px 24px -12px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
}
.user-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:55%;
  background:linear-gradient(180deg, rgba(255,255,255,0.16), transparent);pointer-events:none;
}
.user-avatar{
  width:40px;height:40px;border-radius:13px;flex-shrink:0;position:relative;z-index:1;
  background:radial-gradient(circle at 30% 25%,#8fc0ff,#1c5cff 55%,#0a3ec2 100%);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;
  box-shadow:0 8px 16px -6px rgba(28,92,255,0.55), inset 0 -5px 8px rgba(0,0,0,0.16), inset 0 4px 6px rgba(255,255,255,0.45);
}
.user-info{position:relative;z-index:1;min-width:0;flex:1;}
.role-pill{display:inline-block;background:linear-gradient(135deg,#0fb373,#17d98c);color:#fff;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;margin-bottom:6px;letter-spacing:.03em;}
.user-card .u-name{font-weight:800;font-size:14.5px;margin:0 0 6px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-card .u-meta{font-size:11px;color:rgba(255,255,255,0.72);line-height:1.7;}
.user-card .u-meta .um-row{display:flex;align-items:center;gap:6px;}
.user-card .u-meta .um-row .ico{width:12px;height:12px;flex-shrink:0;opacity:0.85;}
.nav-label{font-size:10.5px;font-weight:800;letter-spacing:.09em;color:rgba(255,255,255,0.45);margin:4px 6px 10px;text-transform:uppercase;}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;border-radius:13px;
  color:rgba(255,255,255,0.72);font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:6px;transition:.15s;border:1px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,0.08);}
.nav-item.active{background:rgba(255,255,255,0.16);color:#fff;border-color:rgba(255,255,255,0.22);backdrop-filter:blur(10px);box-shadow:0 8px 20px -10px rgba(0,0,0,0.35);}
.nav-item .ni-left{display:flex;align-items:center;gap:10px;}
.nav-badge{font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,0.16);color:#fff;}
.nav-badge.new{background:linear-gradient(135deg,#0fb373,#17d98c);color:#fff;}
.nav-badge.gd1{background:linear-gradient(135deg,#c96a04,#f0921e);color:#fff;}
.nav-badge.gd2{background:linear-gradient(135deg,#173f9e,#3d8bff);color:#fff;}
.sidebar-spacer{flex:1;}
.sb-shield{position:relative;margin:6px auto 16px;width:150px;display:flex;align-items:center;justify-content:center;}
.sb-shield img{width:100%;display:block;}
.logout{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,0.65);cursor:pointer;padding:8px 4px;}
.logout:hover{color:#fff;}

.main{flex:1;min-width:0;padding:26px 34px 60px;transition:padding-left .2s;}
.page-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;color:var(--ink);margin-bottom:20px;}
.page-title .ico{font-size:20px;}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:26px 28px;margin-bottom:20px;}
.card h3{margin:0 0 4px;font-size:15.5px;color:var(--ink);}
.card .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 18px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
label.f-label{display:block;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;}

/* banner */
.banner{
  background:linear-gradient(120deg,#0a2a7a,#1c5cff 70%,#20b6e0);border-radius:22px;padding:26px 30px;
  color:#fff;display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:20px;
  box-shadow:0 20px 40px -18px rgba(28,92,255,0.5);position:relative;overflow:hidden;
}
.banner::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.1);pointer-events:none;}
.banner h2{margin:0 0 6px;font-size:20px;font-weight:800;}
.banner p{margin:0;font-size:13px;color:rgba(255,255,255,0.85);max-width:460px;}

/* stepper */
.stepper{display:flex;align-items:center;margin-bottom:0;}
.step-dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0;border:2px solid #d7deef;color:#b7bfd6;background:#fff;}
.step-dot.done{background:linear-gradient(135deg,#0fb373,#17d98c);border-color:transparent;color:#fff;}
.step-dot.active{background:linear-gradient(135deg,#173f9e,#3d8bff);border-color:transparent;color:#fff;box-shadow:0 6px 16px -4px rgba(28,92,255,0.6);}
.step-line{flex:1;height:2px;background:#d7deef;margin:0 6px;}
.step-line.done{background:linear-gradient(90deg,#0fb373,#17d98c);}
.step-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;font-weight:700;color:var(--ink-soft);}
.step-labels span.active{color:var(--bg-3);}
.step-labels span.done{color:var(--success);}
.stepper-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:22px 28px;margin-bottom:20px;}

/* segmented select */
.seg-row{display:flex;gap:14px;}
.seg-card{flex:1;border:2px solid #e6eaf8;border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer;background:#fff;transition:.15s;}
.seg-card:hover{border-color:#c3d1fb;}
.seg-card.selected{border-color:var(--bg-3);background:linear-gradient(135deg,#eef3ff,#e5edff);box-shadow:0 8px 20px -10px rgba(28,92,255,0.35);}
.seg-ico{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#173f9e,#3d8bff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.seg-card .t{font-weight:700;font-size:13.5px;color:var(--ink);}
.seg-card .d{font-size:11.5px;color:var(--ink-soft);}

/* tables */
table.pti{width:100%;border-collapse:collapse;font-size:12.8px;}
table.pti th{text-align:left;color:var(--ink-soft);font-weight:700;font-size:10.8px;text-transform:uppercase;letter-spacing:.03em;padding:9px 10px;border-bottom:1.5px solid var(--line);}
table.pti td{padding:11px 10px;border-bottom:1px solid #f4f6fb;color:var(--ink);vertical-align:middle;}
table.pti tr:hover td{background:#f8faff;}

.status-pill{font-size:10.8px;font-weight:800;padding:5px 11px;border-radius:999px;display:inline-block;white-space:nowrap;}
.status-cho{background:var(--warning-bg);color:var(--warning);}
.status-dang{background:var(--info-bg);color:var(--bg-3);}
.status-done{background:var(--success-bg);color:var(--success);}
.status-tuchoi{background:var(--danger-bg);color:var(--danger);}
.status-soan{background:#f1f2f8;color:#67708f;}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap;}
.fpill{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;background:#f1f3fb;color:var(--ink-soft);cursor:pointer;border:1px solid transparent;}
.fpill.active{background:linear-gradient(135deg,#173f9e,#3d8bff);color:#fff;}
.search-box{padding:9px 14px 9px 38px;border-radius:12px;border:1.5px solid #e4e9f8;font-size:12.8px;width:240px;font-family:inherit;}
.search-wrap{position:relative;display:inline-block;}
.search-wrap .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none;}

.notice{border-radius:14px;padding:13px 16px;font-size:12.8px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;}
.notice.info{background:var(--info-bg);color:#173f9e;}
.notice.warn{background:var(--warning-bg);color:var(--warning);}
.notice.success{background:var(--success-bg);color:var(--success);}
.notice.danger{background:var(--danger-bg);color:var(--danger);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(8,15,40,0.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:#fff;border:1px solid #fff;border-radius:24px;max-width:640px;width:100%;box-shadow:0 30px 70px -20px rgba(0,0,0,0.35);padding:32px;max-height:88vh;overflow:auto;}
.modal-box.wide{max-width:900px;}
.modal-close{float:right;cursor:pointer;color:var(--ink-soft);font-size:20px;line-height:1;}
.center{text-align:center;}

.group-card{border:1.5px solid #e6eaf8;border-radius:16px;padding:18px;margin-bottom:14px;background:#fbfcff;}
.group-head{display:grid;grid-template-columns:1fr 0.6fr 1.3fr 0.9fr;gap:14px;align-items:end;margin-bottom:10px;}
.chip{font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;background:#fff3e0;color:var(--warning);}
.tiny-note{font-size:11px;color:var(--ink-soft);margin-top:4px;}
.switch{position:relative;display:inline-block;width:40px;height:22px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:#d7deef;border-radius:22px;transition:.15s;}
.slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
input:checked + .slider{background:linear-gradient(135deg,#173f9e,#3d8bff);}
input:checked + .slider:before{transform:translateX(18px);}

.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:linear-gradient(135deg,#0a1e4d,#173f9e);border-radius:18px;padding:20px;color:#fff;}
.summary-bar .s-box{padding:6px 4px;}
.summary-bar .s-label{font-size:10px;color:rgba(255,255,255,0.65);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.summary-bar .s-val{font-size:19px;font-weight:800;}
.summary-bar .s-box.hi .s-val{color:var(--cyan);}
.summary-bar .s-sub{font-size:10.5px;color:rgba(255,255,255,0.55);margin-top:3px;}

.actions-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
.qr-box{width:190px;height:190px;border-radius:16px;background:#fff;border:1.5px solid #e4e9f8;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:var(--shadow-sm);}
.progress-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eef1fb;}
.progress-item:last-child{border-bottom:none;}
.p-num{width:26px;height:26px;border-radius:50%;background:#eef1fb;color:var(--ink-soft);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.p-num.done{background:linear-gradient(135deg,#0fb373,#17d98c);color:#fff;}
.p-num.active{background:linear-gradient(135deg,#173f9e,#3d8bff);color:#fff;}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
a{color:inherit;}
.radio3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.radio-card{border:1.5px solid #e6eaf8;border-radius:14px;padding:14px;cursor:pointer;background:#fff;text-align:left;}
.radio-card.selected{border-color:var(--bg-3);background:#eef3ff;box-shadow:0 6px 16px -8px rgba(28,92,255,.3);}
.radio-card .rt{font-weight:700;font-size:13px;margin-bottom:3px;}
.radio-card .rd{font-size:11.2px;color:var(--ink-soft);}

/* slider control block (chiet khau / thu lao) */
.slide-card{border:1.5px solid #e6eaf8;border-radius:16px;padding:18px;background:#fff;}
.slide-card .sc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.slide-card .sc-title{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;}
.slide-card .sc-val{font-weight:800;font-size:13px;}
.slide-card .sc-desc{font-size:11.3px;color:var(--ink-soft);margin-bottom:14px;}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:6px;background:#e4e9f8;margin:10px 0 14px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--bg-3);box-shadow:0 2px 8px rgba(0,0,0,0.25);cursor:pointer;}
.preset-row{display:flex;gap:8px;margin-bottom:12px;}
.preset-btn{flex:1;padding:8px 0;border-radius:10px;border:1.5px solid #e4e9f8;background:#fbfcff;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;text-align:center;}
.preset-btn.active{border-color:transparent;color:#fff;}
.preset-btn.active.discount{background:linear-gradient(135deg,#c96a04,#f0921e);}
.preset-btn.active.rebate{background:linear-gradient(135deg,#0f9e63,#17c775);}
.slide-total{background:#f7f9fe;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;}
.slide-total.discount{color:var(--warning);}
.slide-total.rebate{color:var(--success);}

/* floating fee panel */
.fee-float{
  position:fixed;top:110px;width:250px;background:#fff;border:1px solid var(--line);border-radius:20px;
  box-shadow:0 20px 44px -16px rgba(20,35,90,0.25);padding:18px 18px 20px;z-index:40;
}
.fee-float .ff-title{font-size:11.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.fee-float .ff-badge{float:right;background:var(--info-bg);color:var(--bg-3);font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px;}
.fee-float .ff-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #eef1fb;font-size:12px;}
.fee-float .ff-row span:first-child{color:var(--ink-soft);}
.fee-float .ff-row b{font-weight:800;}
.fee-float .ff-total{margin-top:10px;background:linear-gradient(135deg,#0a2a7a,#1c5cff);color:#fff;border-radius:12px;padding:12px 14px;}
.fee-float .ff-total .l{font-size:9.5px;text-transform:uppercase;color:rgba(255,255,255,0.7);font-weight:700;}
.fee-float .ff-total .v{font-size:17px;font-weight:800;color:var(--cyan);}

/* phân lớp chủ thể (vai trò × loại chủ thể × loại chi tiết) */
.pick-layer{margin-bottom:18px;}
.pick-head{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:10px;}
.pick-num{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#173f9e,#3d8bff);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.pick-layer.locked .pick-num{background:#d7deef;}
.pick-layer.locked .pick-head{color:var(--ink-faint);}
.pick-placeholder{border:1.5px dashed #e1e6f5;border-radius:14px;padding:16px;font-size:12px;color:var(--ink-faint);text-align:center;background:#fbfcff;}
.pick-leaves{font-size:11px;color:var(--bg-3);font-weight:600;margin-top:5px;}
div.f-label{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;}
.route-box{border:1.5px dashed #c3d1fb;border-radius:16px;padding:18px;background:#f7f9ff;}
.path-chip{display:inline-flex;align-items:center;background:#fff;border:1.5px solid #dbe3f7;border-radius:999px;padding:4px 12px;font-size:11.8px;font-weight:700;color:var(--ink-soft);}
.path-chip.last{background:linear-gradient(135deg,#173f9e,#3d8bff);border-color:transparent;color:#fff;}
.path-sep{color:var(--ink-faint);margin:0 6px;font-weight:700;}
.pt-node{font-size:12.5px;font-weight:700;padding:5px 8px;border-radius:8px;color:var(--ink-soft);}
.pt-node.lvl0{font-weight:800;color:var(--ink);margin-top:8px;}
.pt-node.lvl1{padding-left:10px;}
.pt-node.on{color:var(--bg-3);background:#eef3ff;}
.pt-leaves{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 6px 40px;}
.pt-leaf{font-size:11.3px;font-weight:700;padding:4px 10px;border-radius:999px;background:#f1f3fb;color:var(--ink-soft);cursor:pointer;border:1px solid transparent;}
.pt-leaf:hover{border-color:#c3d1fb;}
.pt-leaf.on{background:linear-gradient(135deg,#173f9e,#3d8bff);color:#fff;}
.form-sec{font-size:12px;font-weight:800;color:var(--bg-1);text-transform:uppercase;letter-spacing:.04em;margin:24px 0 12px;padding-top:18px;border-top:1px dashed #e6eaf8;}
.form-sec.first{border-top:none;padding-top:0;margin-top:20px;}
/* Wizard mở hồ sơ */
.wiz-steps{display:flex;align-items:flex-start;}
.wiz-step{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;flex-shrink:0;text-align:center;font-size:11px;font-weight:700;color:var(--ink-soft);}
.wiz-step .step-dot{width:34px;height:34px;font-size:14px;}
.wiz-step.active{color:var(--bg-3);}
.wiz-step.done{color:var(--success);cursor:pointer;}
.wiz-line{flex:1;height:2px;background:#d7deef;margin-top:17px;min-width:12px;}
.wiz-line.done{background:linear-gradient(90deg,#0fb373,#17d98c);}
.wiz-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:20px;border-bottom:1px dashed #e6eaf8;}
.stack{display:grid;gap:14px;}
.id-slot{border:1.5px dashed #c3d1fb;border-radius:14px;height:150px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#f7f9ff;color:var(--ink-soft);font-size:12.5px;text-align:center;transition:.15s;}
.id-slot:hover,.doc-drop:hover{border-color:var(--bg-3);}
.id-slot.filled,.doc-drop.filled{border-style:solid;border-color:#9fe3c4;background:var(--success-bg);color:var(--success);font-weight:700;}
.id-tips{margin-top:14px;padding:12px 16px;border-radius:12px;background:#f7f9fe;font-size:12px;color:var(--ink-soft);line-height:1.8;}
.doc-drop{border:1.5px dashed #c3d1fb;border-radius:14px;padding:22px;text-align:center;cursor:pointer;background:#f7f9ff;font-size:12.8px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:8px;}
.cert-item{border:1.5px solid #e6eaf8;border-radius:14px;padding:16px;margin-bottom:14px;}
.cert-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;}
.rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
.rv-group{border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:12.6px;}
.rv-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--bg-1);margin-bottom:6px;}
.rv-r{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #f4f6fc;}
.rv-r:last-child{border-bottom:none;}
.rv-r span{color:var(--ink-soft);}
.rv-r b{text-align:right;}
.doc-scroll{height:300px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fbfcff;}
.doc-cover{padding:34px 28px;background:linear-gradient(135deg,#173f9e,#3d8bff);color:#fff;}
.doc-brand{font-size:11px;font-weight:700;opacity:.85;letter-spacing:.04em;text-transform:uppercase;}
.doc-title{font-size:20px;font-weight:800;margin-top:14px;line-height:1.35;}
.doc-text{padding:20px 28px;font-size:12.8px;line-height:1.7;color:var(--ink);}
.otp-row{display:flex;gap:8px;justify-content:center;margin:18px 0 8px;}
.otp-in{width:42px;height:48px;text-align:center;font-size:18px;font-weight:800;border:1.5px solid #e4e9f8;border-radius:10px;font-family:inherit;}
.otp-in:focus{outline:none;border-color:var(--bg-3);}
.sx-tbl{border:1px solid var(--line);border-radius:14px;padding:6px 18px;margin:0 0 18px;text-align:left;font-size:12.8px;}
.sx-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid #f4f6fc;}
.sx-row:last-child{border-bottom:none;}
.sx-row span{color:var(--ink-soft);}
.btn[disabled]{opacity:.5;pointer-events:none;}
.sub-groups{margin:14px 0 18px;padding:6px 16px;background:#f7f9fe;border-radius:14px;}
.lvl-row{display:flex;align-items:center;gap:16px;padding:10px 0;flex-wrap:wrap;}
.lvl-row.child{border-top:1px dashed #e1e6f5;}
.lvl-l{width:130px;flex-shrink:0;display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.05em;}
.lvl-elbow{font-size:12px;font-weight:700;color:#8fadf5;}
.seg-tabs{display:inline-flex;background:#e9edf8;border-radius:12px;padding:4px;gap:4px;}
.seg-tab{padding:8px 18px;border-radius:9px;font-size:12.8px;font-weight:700;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:6px;}
.seg-tab:hover{color:var(--ink);}
.seg-tab.active{background:#fff;color:var(--bg-3);box-shadow:0 4px 12px -6px rgba(28,92,255,0.45);}
.seg-tab .cnt{font-size:10.5px;font-weight:800;background:#f1f3fb;color:var(--ink-faint);padding:1px 7px;border-radius:999px;}
.seg-tab.active .cnt{background:var(--info-bg);color:var(--bg-3);}

/* nhóm khách hàng — khai báo quyền lợi chi tiết */
.group-head.g5{grid-template-columns:1fr 1.05fr 0.5fr 1.6fr 0.95fr;}
.bt tr.bt-sec td{background:#f4f6fb;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--bg-1);padding:9px 12px;}
.bt tr.bt-sec[onclick] td{cursor:pointer;}
.bt tr.bt-sec[onclick]:hover td{background:#eaf0ff;}
.bt-tree{display:flex;align-items:center;gap:4px;}
.bt-tree .bt-pick{flex:1;min-width:0;}
.bt-elbow{color:#b8c6ea;font-weight:700;width:12px;flex-shrink:0;margin-left:-4px;}
.bt-car{width:20px;height:20px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;font-size:11px;color:var(--bg-3);cursor:pointer;}
.bt-car:hover{background:#eef3ff;}
.bt-car.leaf{cursor:default;}
.bt-car.leaf:hover{background:none;}
.bt tr.bt-child td{background:#fbfcff;}
.group-sub{display:grid;grid-template-columns:1.4fr 0.9fr 1.2fr;gap:14px;margin-bottom:10px;}
.age-pair{display:flex;align-items:center;gap:6px;}
.age-pair .input{padding:13px 10px;text-align:center;}
.g-sum{display:flex;flex-wrap:wrap;gap:6px;}
.g-sum span{font-size:11px;font-weight:700;background:#eef3ff;color:var(--bg-1);padding:4px 9px;border-radius:8px;}
.g-sum span.off{background:#f1f2f8;color:var(--ink-faint);text-decoration:line-through;}
.g-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed #e6eaf8;padding-top:10px;margin-top:6px;flex-wrap:wrap;}
.g-link{cursor:pointer;font-size:12px;font-weight:700;color:var(--bg-3);display:inline-flex;align-items:center;gap:5px;}
.g-link.danger{color:var(--danger);}
.ben-panel{margin-top:14px;border:1.5px solid #e6eaf8;border-radius:14px;background:#fff;overflow:hidden;}
.ben-tabs{display:flex;gap:4px;padding:8px 8px 0;background:#f6f8fe;border-bottom:1.5px solid #e6eaf8;overflow-x:auto;}
.ben-tab{padding:9px 14px;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap;border:1.5px solid transparent;border-bottom:none;margin-bottom:-1.5px;}
.ben-tab.active{background:#fff;color:var(--bg-3);border-color:#e6eaf8;}
.ben-tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warning);margin-left:6px;vertical-align:1px;}
.ben-tab.off{color:var(--ink-faint);}
.ben-body{padding:16px 18px 18px;}
.ben-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px;}
.ben-field .input{padding:11px 13px;font-size:13.5px;}
.ben-field label.f-label{text-transform:none;letter-spacing:0;font-size:11.8px;}
.fee-float{max-height:calc(100vh - 130px);overflow:auto;}
.fee-float .ff-row{gap:8px;}
.fee-float .ff-row b{white-space:nowrap;}
table.doc-tbl td:first-child{min-width:170px;}
.ben-field.changed .input{border-color:var(--warning);background:#fffaf2;}
.ben-field .std{font-size:10.5px;color:var(--warning);margin-top:4px;font-weight:600;}
.ben-field .hint{font-size:10.5px;color:var(--ink-faint);margin-top:4px;}
.ben-toggle{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink);padding:10px 0;}
.ben-optin{display:flex;align-items:center;justify-content:space-between;background:#f7f9ff;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;font-weight:700;}
.ben-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed #e6eaf8;font-size:12px;color:var(--ink-soft);}
table.rate-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
table.rate-tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);padding:8px 10px;border-bottom:1.5px solid var(--line);}
table.rate-tbl td{padding:8px 10px;border-bottom:1px solid #f4f6fb;}
table.rate-tbl td.num,table.rate-tbl th.num{text-align:right;}
table.rate-tbl input{width:90px;padding:7px 9px;border-radius:9px;border:1.5px solid #dfe6f7;text-align:right;font-family:inherit;font-size:12.5px;}
table.rate-tbl tr.changed input{border-color:var(--warning);background:#fffaf2;}
table.rate-tbl tr.muted td{color:var(--ink-faint);}
table.rate-tbl tfoot td{font-weight:800;border-bottom:none;}
.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;cursor:pointer;padding:6px 0;}
.chk input{margin-top:2px;accent-color:var(--bg-3);width:15px;height:15px;flex-shrink:0;}
.chk-inline{display:flex;gap:18px;flex-wrap:wrap;}
.sec-title{font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 10px;}
.collapse-h{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.collapse-h .caret{font-size:12px;font-weight:700;color:var(--bg-3);}
table.doc-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:20px;border:1px solid #eef1f8;}
table.doc-tbl th{background:#f4f8ff;padding:10px 12px;text-align:left;font-weight:700;color:var(--ink-soft);border-bottom:1px solid #eef1f8;}
table.doc-tbl td{padding:9px 12px;border-bottom:1px solid #eef1f8;vertical-align:top;}
table.doc-tbl td.sec{background:#fafbff;font-weight:800;color:var(--bg-1);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
table.doc-tbl td.cust{background:#fffaf2;color:var(--warning);font-weight:700;}
/* nhóm khách hàng — thẻ thu gọn, danh sách quyền lợi dạng accordion, popup Codebook */
.group-head.g3{grid-template-columns:1.2fr 0.45fr 1.6fr;}
.grp-toolbar{display:flex;align-items:center;gap:16px;margin:12px 0;flex-wrap:wrap;}
.grp-toolbar .input{max-width:300px;padding:9px 13px;font-size:13px;}
.grp-toolbar .sp{flex:1;}
.group-card.collapsed{background:#fff;padding:12px 16px;margin-bottom:8px;}
.group-card.collapsed:hover{border-color:#c9d6ff;}
.gc-row{display:flex;align-items:center;gap:14px;cursor:pointer;}
.group-card.open .gc-row{padding-bottom:12px;margin-bottom:14px;border-bottom:1px dashed #e6eaf8;}
.gc-caret{width:24px;height:24px;border-radius:8px;background:#eef3ff;color:var(--bg-3);display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;transition:transform .15s;}
.group-card.open .gc-caret{transform:rotate(90deg);}
.gc-main{flex:1;min-width:0;}
.gc-name{font-weight:800;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.gc-meta{font-size:12px;color:var(--ink-soft);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gc-fee{text-align:right;flex-shrink:0;}
.gc-fee .v{font-weight:800;font-size:15px;color:var(--bg-1);}
.gc-fee .s{font-size:11px;color:var(--ink-faint);}
.gc-acts{display:flex;gap:12px;flex-shrink:0;padding-left:6px;border-left:1px solid #eef1fa;}
.group-card.collapsed .g-sum{margin:8px 0 0 38px;}
.chip.blue{background:#eef3ff;color:var(--bg-3);}
.ben-acc{margin-top:14px;border:1.5px solid #e6eaf8;border-radius:14px;background:#fff;overflow:hidden;}
.ba-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:#f6f8fe;border-bottom:1.5px solid #e6eaf8;font-size:12.5px;font-weight:800;color:var(--ink);}
.ba-hd small{font-weight:600;color:var(--ink-faint);margin-left:6px;font-size:11.5px;}
.ben-acc .ben-foot{margin:0;padding:11px 14px;border-top:1px dashed #e6eaf8;}
/* bảng quyền lợi động */
.bt-wrap{overflow-x:auto;}
table.bt{width:100%;min-width:680px;border-collapse:collapse;font-size:12.5px;table-layout:fixed;}
table.bt th{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);font-weight:800;text-align:left;padding:9px 8px;border-bottom:1.5px solid #e6eaf8;background:#fbfcff;white-space:nowrap;}
table.bt td{padding:6px 5px;border-bottom:1px solid #eef1fa;vertical-align:middle;}
table.bt th.num,table.bt td.num{text-align:right;}
table.bt td.idx{width:30px;text-align:center;color:var(--ink-faint);font-weight:700;}
table.bt tr.added td.idx{box-shadow:inset 3px 0 0 var(--bg-3);color:var(--bg-3);}
table.bt tr.muted td{opacity:.6;}
table.bt .fee{font-size:10.5px;font-weight:700;color:var(--bg-1);white-space:nowrap;text-align:right;margin-top:2px;}
table.bt td.act{white-space:nowrap;text-align:center;}
table.bt td.empty{text-align:center;color:var(--ink-faint);padding:22px;}

.lg-added{display:inline-block;width:3px;height:12px;background:var(--bg-3);vertical-align:-2px;margin-right:6px;border-radius:2px;}
.cb-list{max-height:50vh;overflow:auto;padding-right:4px;}
.cb-cat{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin:14px 0 6px;}
.cb-item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1.5px solid #e6eaf8;border-radius:12px;margin-bottom:7px;cursor:pointer;}

.cb-code{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;font-weight:700;color:var(--bg-3);background:#eef3ff;padding:2px 6px;border-radius:6px;margin-right:4px;}
.cb-t{font-weight:800;font-size:13px;color:var(--ink);}
.cb-d{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.cb-r{font-size:10.5px;color:var(--ink-faint);text-align:right;white-space:nowrap;}

.cb-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid #eef1fa;}
/* quản lý hồ sơ theo 2 view: Người bán (CBKD) / Quản trị (HĐQT) */
.view-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.view-bar .vb-who{font-size:12px;color:var(--ink-soft);}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}

.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-sm);}

.mg-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}

.tier-bar{display:inline-flex;align-items:center;gap:4px;background:#e9edf8;border-radius:10px;padding:3px;}

.net-crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;background:#f7f9ff;border:1px dashed #c3d1fb;border-radius:12px;padding:8px 12px;margin-bottom:12px;}

.net-av.t-collaborator{background:linear-gradient(135deg,#0f8f7e,#20b6e0);}
.net-av.t-agent_individual{background:linear-gradient(135deg,#5a2ec7,#8a5cf0);}
.net-av.t-agent_org{background:linear-gradient(135deg,#c96a04,#f0921e);}
.net-main{flex:1;min-width:0;cursor:pointer;}

.net-sub{font-size:11px;color:var(--ink-faint);margin-top:1px;}

.kh-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.3px;font-weight:700;padding:4px 10px;border-radius:999px;background:#f1f5ff;color:var(--bg-1);cursor:pointer;border:1px solid transparent;}
.kh-chip:hover{border-color:#c3d1fb;}
.kh-chip.hit{background:#fff1d6;}
.tier{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:#eef3ff;color:var(--bg-3);}
.chip.purple{background:#f1ebff;color:#6a3fd6;}
.chip.orange{background:var(--warning-bg);color:var(--warning);}
.chip.gray{background:#f1f2f8;color:#67708f;}
.net-sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:18px 0 6px;display:flex;align-items:center;gap:8px;}
.net-sec:first-child{margin-top:4px;}
.net-sec .tiny-note{margin:0;text-transform:none;letter-spacing:0;font-weight:600;}
.rel-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.rel-box{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.6px;}
.rel-box .f-label{margin-bottom:6px;}
/* tối giản: KPI có icon, thống kê dạng icon + số (tooltip thay chú thích) */
.kpi{display:flex;align-items:center;gap:12px;}
.kpi .k-ic{width:40px;height:40px;border-radius:12px;background:#eef3ff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

.kpi .k-v{margin-top:0;font-size:20px;}
.nst{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--ink-soft);background:#f4f6fb;border-radius:8px;padding:3px 8px;margin-left:4px;}
.seg-tabs.sm .seg-tab{padding:6px 12px;font-size:12px;}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1.5px solid #e4e9f8;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;}

/* bộ chọn view ở đầu menu */
.sidebar > .ws-wrap{position:relative;z-index:5;margin-bottom:18px;}
.ws-card{cursor:pointer;margin-bottom:0;padding-right:34px;transition:.15s;}

.ws-mask{position:fixed;inset:0;z-index:0;}
.ws-menu{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:2;background:#fff;border-radius:16px;box-shadow:0 24px 50px -16px rgba(3,10,40,.55);padding:8px;color:var(--ink);}

.nav-item.sub{margin-left:18px;padding:9px 12px;font-size:13px;}

.auth2{max-width:430px;margin:24px auto;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-sm);padding:30px 32px;}
.auth2 h2{margin:0 0 20px;font-size:22px;font-weight:800;}
.auth-role{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:800;background:var(--info-bg);color:var(--bg-3);padding:4px 10px;border-radius:999px;margin-bottom:10px;}

.auth2 .input{padding:11px 14px;font-size:13.5px;}
.pt-head{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:var(--shadow-sm);margin-bottom:18px;}

.pt-sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 18px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.pt-sec-h{font-weight:800;font-size:13px;padding:2px 0 6px;}
.pt-r{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid #f4f6fc;font-size:12.8px;}
.pt-r:last-child{border-bottom:none;}
.pt-r span{color:var(--ink-soft);}
.pt-r b{text-align:right;}
.pt-r b.dash{color:var(--ink-faint);font-weight:500;}
/* "Tôi" — 1 ID chủ thể, nhiều hồ sơ */
.me-wrap{position:relative;}
.me-chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-size:12.8px;box-shadow:var(--shadow-sm);}
.me-chip:hover{border-color:#c3d1fb;}
.me-n{font-size:10.5px;font-weight:800;background:var(--info-bg);color:var(--bg-3);padding:2px 8px;border-radius:999px;}
.me-mask{position:fixed;inset:0;z-index:49;}
.me-pop{position:absolute;right:0;top:calc(100% + 8px);width:400px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:10px;z-index:50;}
.me-hd{display:flex;gap:10px;align-items:center;padding:6px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:13px;}
.me-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer;font-size:12.8px;}
.me-row:hover{background:#f6f8ff;}
.me-ic{font-size:18px;width:24px;text-align:center;}
.sys-chip{font-size:10.5px;font-weight:800;background:#f1f2f8;color:#4b5575;padding:2px 8px;border-radius:6px;white-space:nowrap;}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sdot.ok{background:var(--success);}
.sdot.wait{background:var(--warning);}
/* MCV — hàng chờ phê duyệt (tham khảo OPC Đky iCA) */
.act-ic{position:relative;width:30px;height:30px;border:1.5px solid #e6eaf8;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;font-size:13px;margin-left:4px;}
.act-ic:hover{border-color:var(--bg-3);}
.act-ic .tip{position:absolute;top:36px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;padding:4px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;z-index:30;}
.act-ic:hover .tip{opacity:1;}
.act-ic .bdg{position:absolute;top:-6px;right:-6px;background:var(--bg-3);color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:1px 5px;}
.prio{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:6px;}
.prio.HIGH{background:var(--danger-bg);color:var(--danger);}
.prio.MEDIUM{background:var(--warning-bg);color:var(--warning);}
.prio.LOW{background:#f1f2f8;color:#67708f;}
table.pti td.due-late{color:var(--danger);font-weight:700;}
.req-banner{background:#fff7e8;border:1px solid #f0e2c0;border-radius:14px;padding:12px 16px;font-size:13.5px;color:#5a4a20;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.back-link{color:var(--bg-3);font-weight:700;cursor:pointer;font-size:13px;display:inline-block;margin-bottom:12px;}
.cust-sticky{position:sticky;top:0;z-index:15;background:var(--content-bg);padding:4px 0 12px;}
.cust{display:flex;gap:22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-sm);}

.cust-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 30px;flex:1;}
.cust-info .k{font-size:11px;color:var(--ink-faint);}
.cust-info .v{font-size:13.5px;font-weight:700;margin-top:2px;}
.ck-title{font-size:14px;font-weight:800;margin:6px 0 12px;display:flex;align-items:center;gap:8px;}
.ck-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden;}
.ck-card.ok{border-color:#9fe3c4;}
.ck-card.no{border-color:#f5b5bd;}
.ck-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#f7f9fc;border-bottom:1px solid var(--line);font-size:13.5px;}
.ck-num{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#173f9e,#3d8bff);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ck-bd{display:flex;gap:20px;padding:16px;}

.radio-opt input{width:16px;height:16px;accent-color:var(--success);cursor:pointer;}

.ck-bar{position:sticky;bottom:12px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 -6px 24px -10px rgba(20,35,90,.3);margin-top:6px;}

// Bộ quyền lợi mở rộng dần theo Level: min = Level thấp nhất có quyền lợi đó
function presetRows(p){
  const b=p.b, R=p.rates||{}, L=p.level||5, rows=[];
  const add=(code, si, rate, min)=>{ if(!si || L<(min||1)) return; const c=cbItem(code); rows.push({code, from:0, to:65, si, pay:c.pay||'', geo:'', rate:rate!=null?rate:(c.rate||0)}); };
  // Quyền lợi chính tăng dần: L1 Tai nạn + Nội trú → L2 + Y tế do tai nạn → L3 + Ngoại trú → L4 + Tử vong do bệnh
  add('QLTN.01', b.tnDeath);
  add('QLTN.01.01', b.tnDeath, null, 5);
  add('QLTN.01.02', b.tnDeath, null, 5);
  add('QLTN.02', b.tnMed, null, 2);
  add('QLSK.01', b.dthIllness, null, 4);
  add('QLSK.02', b.ipLimit, R.ip);
  add('QLSK.02.01', b.ipRoom);
  add('QLSK.02.03', b.ipSurgery);
  add('QLSK.02.04', b.ipPre, null, 2);
  add('QLSK.02.05', b.ipPost, null, 2);
  add('QLSK.02.06', b.ipAllowance, null, 3);
  add('QLSK.02.07', b.ipAmbulance, null, 3);
  add('QLSK.02.08', b.ipFuneral, null, 4);
  if(b.opOn){ add('QLSK.04', b.opLimit, R.op, 3); add('QLSK.04.01', b.opVisit, null, 3); add('QLSK.04.02', b.opPhysio, null, 4); add('QLSK.04.03', b.opPrenatal, null, 4); }
  // Quyền lợi bổ sung từ Level 3
  add('QLTN.03', b.tnSalaryDay*b.tnSalaryDays, null, 3);
  if(b.dtOn){ add('QLSK.05', b.dtLimit, null, 3); add('QLSK.05.01', b.dtScaling, null, 4); }
  if(b.maOn){ add('QLSK.03', b.maLimit, null, 4); add('QLSK.03.01', b.maBaby, null, 5); }
  add('QLSK.06', [0,0,0,0,200e6,300e6][L], null, 4);
  add('QLSK.07', 1500000, null, 5);
  add('QLSK.08', 2000000, null, 5);
  add('QLHT.01', 500000000, null, 5);
  return rows;
}
// Phí 1 dòng = STBH × tỷ lệ phí × hệ số phạm vi (phạm vi riêng của dòng, trống = theo nhóm — VD gói Elite: Thai sản chỉ Châu Á)
function rowFee(r, geo){ return r.si*r.rate/100*geoById(r.geo||geo).factor; }
// Phí/người = Σ phí các dòng có băng tuổi giao với độ tuổi nhóm; 1 quyền lợi nhiều băng tuổi → lấy băng có phí cao nhất
function rowsFee(rows, geo, bhyt, ageFrom, ageTo){
  const byCode={};
  rows.forEach(r=>{ if(r.to<ageFrom || r.from>ageTo) return; byCode[r.code]=Math.max(byCode[r.code]||0, rowFee(r,geo)); });
  const raw=Object.values(byCode).reduce((s,x)=>s+x,0);
  const bhytF=bhyt?0.95:1;
  return {raw, bhytF, perPerson:Math.round(raw*bhytF/1000)*1000};
}

const EMOJI_RE = new RegExp(Object.keys(EMOJI_ICON).sort((a,b)=>b.length-a.length).map(e=>e.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'), 'g');
function iconize(html){ return html.replace(EMOJI_RE, m=>I(EMOJI_ICON[m])); }

function openMoidForm(preLeaf, preEntity){
  const leafKey = LEGACY_TYPE_TO_LEAF[preLeaf] || (SUBJECT_LEAVES[preLeaf] ? preLeaf : null);

function pathChips(leafKey){
  const l=SUBJECT_LEAVES[leafKey];

  return parts.map((t,i)=>`<span class="path-chip ${i===parts.length-1?'last':''}">${t}</span>`).join('<span class="path-sep">›</span>');
}

function renderPickTree(){
  const p=S.moid.pick, roleFirst = p.order==='role';
  const tops = roleFirst ? Object.keys(SUBJECT_ROLES) : Object.keys(SUBJECT_ENTITIES);
  const mids = roleFirst ? Object.keys(SUBJECT_ENTITIES) : Object.keys(SUBJECT_ROLES);
  let html='';
  tops.forEach(t=>{
    const topOn = p[roleFirst?'role':'entity']===t;
    const topLabel = roleFirst ? SUBJECT_ROLES[t].label : entityLabel(null,t);
    html += `<div class="pt-node lvl0 ${topOn?'on':''}">${topLabel}</div>`;
    mids.forEach((m,mi)=>{
      const role = roleFirst?t:m, entity = roleFirst?m:t;
      const ls = leavesOf(role,entity); if(!ls.length) return;
      const midOn = topOn && p[roleFirst?'entity':'role']===m;
      const midLabel = roleFirst ? entityLabel(role,m) : SUBJECT_ROLES[m].label;
      html += `<div class="pt-node lvl1 ${midOn?'on':''}"><span class="tree-guide tree-guide-elbow">${mi===mids.length-1?'└':'├'}</span>${midLabel}</div>`;
      html += `<div class="pt-leaves">${ls.map(k=>`<span class="pt-leaf ${p.leaf===k?'on':''}" onclick="moidJumpLeaf('${k}')">${SUBJECT_LEAVES[k].short}</span>`).join('')}</div>`;
    });
  });
  return html;
}

function findGroup(code){
  code=String(code||'').trim().toLowerCase(); if(!code) return null;
  const orgs=S.orgPortal.orgs.filter(o=>o.custType==='agent_org');
  return orgs.find(o=>o.id.toLowerCase()===code || o.mst===code) || orgs[0] || null;
}
function ctvChannelOrg(d){ return findGroup(d.groupCode); }
const ctvChannelText = d => { const g=findGroup(d.groupCode); return g ? `${g.id} · ${g.name}` : (d.groupCode || 'Không'); };

function wizAddr(){ const d=W().data; return [d.addr, d.ward, d.province].filter(Boolean).join(', '); }
function wizRels(){
  const k=S.moid.type, d=W().data, rels=[];
  if(k==='kh_dn' && d.parentId && !d.parentId.startsWith('Không')) rels.push(['Tổng công ty – chi nhánh', d.parentId]);
  if(k==='kh_cn' && d.relType && d.relType!=='Không khai báo') rels.push([d.relType, d.relId]);
  return rels;
}
function rvGroup(title, rows){
  return `<div class="rv-group"><div class="rv-h">${title}</div>${rows.filter(Boolean).map(([k,v])=>`<div class="rv-r"><span>${k}</span><b>${v||'<span style="color:var(--ink-faint);font-weight:500;">Không có thông tin</span>'}</b></div>`).join('')}</div>`;
}
function wsReview(){
  const k=S.moid.type, l=wizLeaf(), d=W().data, dup=W().dup, isOrg=l.entity==='tochuc', isNb=l.role==='nb';
  const fd = v=>v?fmtDateVN(v):'';
  const chip = (t,bg,c)=>`<span class="chip" style="background:${bg};color:${c};margin-left:6px;">${t}</span>`;
  const groups = [];
  groups.push(rvGroup('Chủ thể (ID)', [
    ['ID chủ thể', dup ? dup.id+chip('Dùng lại','var(--info-bg)','var(--bg-3)') : 'Cấp khi hoàn tất'+chip('Mới','var(--success-bg)','var(--success)')],
    ['Loại chủ thể', isOrg ? 'Pháp nhân › '+{kh_dn:'Doanh nghiệp', kh_pdn:'Phi doanh nghiệp', kh_hkd:'Hộ kinh doanh', nb_dltc:'Doanh nghiệp'}[k] : 'Cá nhân'],
    ['Loại giấy tờ', d.idType],
    [isOrg?'Giá trị định danh':'Số giấy tờ', isOrg?d.mst:d.idno],
    ['Tên gọi', d.name],
    isOrg ? ['Ngày thành lập', fd(d.foundDate)] : ['Ngày sinh · Giới tính', [fd(d.dob), d.gender].filter(Boolean).join(' · ')],
    isOrg ? [k==='kh_hkd'?'Chủ hộ':'Người đại diện', [d.rep, d.repTitle].filter(Boolean).join(' · ')] : ['Ngày cấp · Nơi cấp', [fd(d.idDate), d.idPlace].filter(Boolean).join(' · ')],  ]));
  const prof = [
    ['Nghiệp vụ', 'Bảo hiểm · Listing'],
    ['Vai trò', isNb ? l.rolePath : 'Khách hàng › '+d.khRoles.map(r=>ROLE_META[r].short).join(', ')],
    ['ID hồ sơ', `${l.prefix}-xxxxx`],
  ];
  // Thông tin liên hệ chỉ khai ở luồng người bán (bước Thông tin bổ sung)
  if(isNb) prof.push(isOrg ? ['Người liên hệ', d.contact||d.name] : null, ['Số điện thoại', d.phone], ['Email', d.email], ['Địa chỉ liên hệ', wizAddr()]);
  if(isNb) prof.push(['Tài khoản thụ hưởng', d.bankAcc ? `${d.bank} · ${d.bankAcc}` : '']);
  if(isNb && k!=='nb_ctv') prof.push(['Đơn vị PTI', d.unit]);
  if(k==='nb_cbkd') prof.push(['Mã nhân viên · Chức danh', [d.empId, d.jobTitle].filter(Boolean).join(' · ')]);
  if(k==='nb_dltc') prof.push(['Chương trình sản phẩm', d.products]);
  if(k==='nb_dlcn') prof.push(['Mã người giới thiệu', d.referrer]);
  if(k==='nb_ctv') prof.push(['Mã nhóm', ctvChannelText(d)]);
  if(isNb) groups.push(rvGroup('Vai trò & hồ sơ nghiệp vụ', prof));
  const rels = wizRels();
  if(rels.length) groups.push(rvGroup('Quan hệ', rels));
  if(ORG_DOC[k]) groups.push(rvGroup('Giấy tờ hậu kiểm', [[ORG_DOC[k].doc, W().up.doc
    ? ORG_DOC[k].file+chip('Chờ hậu kiểm','var(--warning-bg)','var(--warning)')
    : 'Chưa đính kèm']]));
  if(k==='nb_dlcn') groups.push(rvGroup('Chứng chỉ bảo hiểm', W().certs.map((u,i)=>[`Chứng chỉ ${i+1}`, [d['certType'+u], d['certNo'+u]].filter(Boolean).join(' · ')])));
  if(k==='nb_dltc'){
    const met = AGENT_CONDS.filter((c,i)=>d['cond'+i]).length;
    const staff = Array.from({length:W().staffN},(_,i)=>d['stName'+i]).filter(Boolean).length;
    groups.push(rvGroup('Điều kiện đại lý tổ chức', [['Điều kiện đạt', `${met}/${AGENT_CONDS.length}`], ['Nhân sự có chứng chỉ', `${staff} người`]]));
  }
  return `${wizDupNotice()}
  <div class="rv-grid">${groups.join('')}</div>`;
}

function wizStepper(){
  const f=wizFlow(), idx=W().i;
  const cls = i => i<idx ? 'done' : i===idx ? 'active' : '';
  return `<div class="stepper-card"><div class="wiz-steps">${f.map((s,i)=>`${i?`<div class="wiz-line ${i<=idx?'done':''}"></div>`:''}
    <div class="wiz-step ${cls(i)}" ${i<idx?`onclick="wizGo(${i})"`:''}><div class="step-dot ${cls(i)}">${i<idx?'✓':i+1}</div><span>${WIZ_LABELS[s]}</span></div>`).join('')}
  </div></div>`;
}
function renderWizard(){
  const k=S.moid.type, l=wizLeaf(), key=wizFlow()[W().i], isNb=l.role==='nb';
  const body = {cccd:wsCccd, person:wsPerson, orgDoc:wsOrgDoc, orgInfo:wsOrgInfo, khProfile:wsKhProfile, nbExtra:wsNbExtra, certs:wsCerts, agentCond:wsAgentCond, review:wsReview, contract:wsContract}[key]();
  let primary;
  if(key==='contract') primary = `<button class="btn btn-primary" id="wiz-sign" ${W().agree?'':'disabled'} onclick="wizOpenOtp()">Giao kết hợp đồng →</button>`;
  else if(key==='review' && !isNb) primary = `<button class="btn btn-primary" onclick="wizSubmitKh()">${icon_check()} Mở hồ sơ</button>`;
  else primary = `<button class="btn btn-primary" onclick="wizNext()">${key==='review'?'Tiếp tục ký hợp đồng →':'Tiếp tục →'}</button>`;

function wizSellerRows(contractNo){
  const k=S.moid.type, l=wizLeaf(), d=W().data;
  const rows = [['Vai trò', l.rolePath], ['Mã hồ sơ yêu cầu', contractNo], ['Ngày gửi yêu cầu', fmtDateVN(new Date().toISOString().slice(0,10))], k==='nb_ctv' ? null : ['Đơn vị PTI quản lý', d.unit], ['Tài khoản thụ hưởng', d.bankAcc ? `${d.bank} · ${d.bankAcc}` : '']].filter(Boolean);

  if(k==='nb_ctv') rows.push(['Mã nhóm', ctvChannelText(d)]);
  if(k==='nb_dlcn'){ W().certs.forEach((u,i)=>rows.push([`Chứng chỉ ${i+1}`, [d['certType'+u], d['certNo'+u]].filter(Boolean).join(' · ')])); rows.push(['Mã người giới thiệu', d.referrer]); }
  if(k==='nb_dltc') rows.push(['Chương trình sản phẩm', d.products], ['Điều kiện đại lý đạt', `${AGENT_CONDS.filter((c,i)=>d['cond'+i]).length}/${AGENT_CONDS.length}`]);

function wizFinish(){
  const k=S.moid.type, l=wizLeaf(), d=W().data, dup=W().dup, isOrg=l.entity==='tochuc', isNb=l.role==='nb';
  const rnd = ()=>Math.floor(10000+Math.random()*89999);
  const id = l.prefix+'-'+rnd();
  const subjectId = dup ? dup.id : 'CT-'+rnd();
  const today = new Date().toISOString().slice(0,10);
  const parentRef = k==='kh_dn' && d.parentId && !d.parentId.startsWith('Không') ? opFind(d.parentId.split(' · ')[0]) : null;
  const contractNo = isNb ? CONTRACT_META[k].prefix+'-2026-'+rnd() : null;
  // Người bán: ký xong chỉ là gửi yêu cầu giao kết — PTI kiểm tra, phê duyệt rồi mới kích hoạt vai trò
  const pendingReason = isNb ? ({nb_dlcn:'Đã gửi yêu cầu giao kết — chờ PTI xác thực chứng chỉ bảo hiểm và phê duyệt.', nb_dltc:'Đã gửi yêu cầu giao kết — chờ PTI thẩm định điều kiện đại lý tổ chức và phê duyệt.'}[k] || 'Đã gửi yêu cầu giao kết — chờ PTI kiểm tra và phê duyệt.') : null;
  const roleCode = {nb_cbkd:'CBKD', nb_ctv:'CTV', nb_dlcn:'DAILY', nb_dltc:'DAILY'}[k];
  const name = d.name || 'Chưa cập nhật';
  const docCheck = ORG_DOC[k] ? {doc:ORG_DOC[k].doc, file:W().up.doc ? ORG_DOC[k].file : null, status:W().up.doc ? 'pending' : 'missing'} : null;
  S.orgPortal.orgs.push({
    id, subjectId, custType:l.custType, parentId:parentRef?parentRef.id:null, name, fullName:name,
    mst: isOrg ? (d.mst||'—') : (d.tax||'—'), unitType: d.orgKind || l.label, orgKind:d.orgKind, level: parentRef ? Math.min(parentRef.level+1,3) : 1,
    contact: d.contact || d.rep || name, phone:d.phone||'—', email:d.email||'—', address: (isNb ? wizAddr() : d.addr) || d.hqAddr || d.permAddr || '—',
    roles: isNb ? [roleCode] : (d.khRoles.length ? d.khRoles : ['BMBH']),
    idNo: isOrg ? undefined : d.idno, dob:d.dob, gender:d.gender, orgCode: k==='kh_pdn' ? d.mst : undefined,
    certNo: k==='nb_dlcn' ? d['certNo'+W().certs[0]] : undefined, managerId:d.managerId, managerName:d.managerId, empId:d.empId, unit:d.unit,
    // View Người bán: KH mới do CBKD đang đăng nhập careby, người bán mới vào tuyến dưới F1 của CBKD; người bán luôn vào hàng chờ phê duyệt
    sellerId: !isNb && S.view==='seller' ? S.me : undefined,
    ...(isNb ? wizUpline(d) : {}),
    req: isNb ? {code:contractNo, date:today} : undefined,
    workOrgId: k==='nb_ctv' ? (ctvChannelOrg(d)||{}).id : undefined,
    seller: isNb ? wizSellerRows(contractNo) : undefined,
    staff:[], roster:[],
    programs: isNb ? [{type:roleCode, programId:id, contractNo:'—', effFrom:null, effTo:null, status:'pending', pendingReason}] : [],
  });
  if(parentRef) S.orgPortal.expanded[parentRef.id]=true;
  if(portalRole()) portalAfterFinish(id); else { opSetCustTab(l.custType, true); S.tab=l.role; }
  opLogActivity(isNb ? 'Ký hợp đồng & mở hồ sơ người bán' : 'Mở hồ sơ khách hàng', `${name} (${id}) — ${l.label}${dup?' · dùng lại ID chủ thể '+subjectId:''}`);
  if(docCheck) S.orgPortal.orgs[S.orgPortal.orgs.length-1].docCheck = docCheck;
  S.moid.result = {id, subjectId, reused:!!dup, leaf:k, name, contractNo, signedAt:new Date().toLocaleString('vi-VN'), pendingReason, docCheck};
  S.moid.step='success'; render();
}

function newQuote(){
  const nq = hydrateQuote({id:uid('PTI-CARE-DFT'), company:null, mst:null, khid:null, employees:null, premium:null, discount:5, rebate:5, status:'dang_soan', groups:[mkGroup({name:'Nhóm 1'})], baseChanged:false, effDate:new Date().toISOString().slice(0,10), termMonths:12});

function hydrateQuote(q){
  if(!q) return q;
  if(!Array.isArray(q.groups) || q.groups.length===0){
    // Suy ra 1 nhóm mặc định từ số NV và premium (nếu có) - fallback an toàn cho seed data cũ
    const n = Number(q.employees)||1;
    q.groups = [mkGroup({name:'Nhóm 1', count:n})];
  }
  q.groups = q.groups.map(g => g.rows ? g : mkGroup({name:g.name, count:g.count, preset:'L'+(g.level||3)}));
  if(!q.effDate) q.effDate = new Date().toISOString().slice(0,10);
  if(!q.termMonths) q.termMonths = 12;
  if(q.discount==null) q.discount = 5;
  if(q.rebate==null) q.rebate = 5;
  if(!q.terms) q.terms = mkTerms();
  if(!q.claims) q.claims = mkClaims();
  if(!q._open) q._open = {terms:false, claims:false};
  // Phương án: q.groups / q.terms luôn trỏ vào phương án đang chọn
  if(!q.plans){ q.plans=[{id:'P'+(++_gid), name:'Phương án 1', kind:'option', groups:q.groups, terms:q.terms}]; q.planIdx=0; }
  else { q.plans[q.planIdx].groups=q.groups; q.plans[q.planIdx].terms=q.terms; }
  q.baseChanged = q.groups.some(g=>groupDiffs(g).length>0);
  return q;
}
function mkGroup(o){
  o = o || {};
  const p = presetById(o.preset || 'L3');
  return {
    id:'G'+(++_gid), name:o.name||'Nhóm mới', subject:o.subject||(p.family==='elite'?'lanhdao':'nhanvien'), title:o.title||'',
    count:o.count||1, ageFrom:18, ageTo:65, salary:0,
    preset:p.id, level:p.level||null, geo:p.geo, bhyt:false,
    rows:JSON.parse(JSON.stringify(p.rows)),
    _open:o._open!=null?o._open:true,
  };
}
function groupFee(g){ const f=rowsFee(g.rows, g.geo, false, g.ageFrom, g.ageTo); f.total=f.perPerson*(Number(g.count)||0); return f; }
// So sánh với gói chuẩn theo từng dòng (mã quyền lợi + băng tuổi). Phạm vi địa lý được chọn tự do, có hệ số phí riêng.
function rowKey(r){ return r.code+'|'+r.from+'|'+r.to; }
function stdRow(g, r){ return presetById(g.preset).rows.find(x=>rowKey(x)===rowKey(r)); }
function groupDiffs(g){
  const d=[];
  g.rows.forEach(r=>{ const s=stdRow(g,r); if(!s || s.si!==r.si || s.pay!==r.pay || s.rate!==r.rate || (s.geo||'')!==(r.geo||'')) d.push(rowKey(r)); });
  presetById(g.preset).rows.forEach(s=>{ if(!g.rows.some(r=>rowKey(r)===rowKey(s))) d.push('-'+rowKey(s)); });
  return d;
}

function renderStepperChaophi(step){
  const items=[ {label:'Thông tin doanh nghiệp', icon:'<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="3" width="16" height="18" rx="1" stroke="currentColor" stroke-width="1.7"/><path d="M8 7h2M13 7h2M8 11h2M13 11h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="9.5" y="15.5" width="4" height="5.5" stroke="#2f6bff" stroke-width="1.5"/></svg>'}, {label:'Chào phí nhanh', icon:'<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v9M9.3 9.2c0-1 1-1.7 2.7-1.7s2.7.8 2.7 1.8c0 2.4-5.4 1-5.4 3.4 0 1 1 1.8 2.7 1.8s2.7-.7 2.7-1.7" stroke="#2f6bff" stroke-width="1.5" stroke-linecap="round"/></svg>'}, {label:'Hợp đồng khung', icon:'<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3v4h4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 12h8M8 16h5" stroke="#2f6bff" stroke-width="1.7" stroke-linecap="round"/></svg>'} ];
  let html = `<div class="stepper">`;
  items.forEach((it,idx)=>{
    const i=idx+1;
    const st = i<step?'done':(i===step?'active':'');
    html += `<div class="step-dot ${st}">${i<step?'<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12.5l4.5 4.5L19 7" stroke="#2f6bff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>':it.icon}</div>`;

  });
  html += `</div><div class="step-labels">${items.map((it,i)=>`<span class="${i+1<step?'done':(i+1===step?'active':'')}">${it.label}</span>`).join('')}</div>`;
  return html;
}

        <div><label class="f-label">Tên tổ chức / Doanh nghiệp</label><input class="input" value="${found?found.name:''}" placeholder="Chưa có thông tin" readonly></div>
        <div><label class="f-label">Số điện thoại Hotline / Văn phòng</label><input class="input" value="${found?found.phone:''}" placeholder="Chưa có thông tin" readonly></div>

        <div><label class="f-label">Địa chỉ Email Doanh nghiệp</label><input class="input" value="${found?found.email:''}" placeholder="Chưa có thông tin" readonly></div>
        <div><label class="f-label">Địa chỉ trụ sở chính</label><input class="input" value="${found?found.address:''}" placeholder="Chưa có thông tin" readonly></div>

}
function handleMstInput(el){
  const digits = el.value.replace(/\D/g,'');
  if(digits.length===10 || digits.length===13){
    lookupCustomer();
    const inp=document.getElementById('mst-input');
    if(inp){ inp.focus(); const p=inp.value.length; inp.setSelectionRange(p,p); }
  }
}
function lookupCustomer(){
  const val = document.getElementById('mst-input').value.trim();
  const cust = lookupByMST(val);
  const q=S.chaophi.current;
  if(cust){
    q.mst=cust.mst; q.khid=cust.khid; q.company=cust.name;
    q._address=cust.address; q._contact=cust.contact; q._position=cust.position; q._phone=cust.phone; q._email=cust.email; q._industry=cust.industry;
  }
  render();
}
function backToChaophiList(){ S.chaophi.screen='list'; render(); }
function goChaophiStep2(){ S.chaophi.screen='step2'; render(); }

function computeQuotePremium(q){
  return q.groups.reduce((s,g)=> s + groupFee(g).total, 0);
}
/* ---------- Phương án chào phí (Excel: 2025-2026 hiện tại / 2026-2027 PA1 / PA2) ----------
   Mỗi phương án = 1 bộ nhóm KH + quyền lợi + điều khoản. Nhân bản phương án giữ nguyên id nhóm để so sánh theo nhóm.
   kind: 'current' = hợp đồng hiện tại (tham chiếu, không chốt được) · 'option' = phương án đề xuất */
function planPremium(p){ return p.groups.reduce((s,g)=>s+groupFee(g).total,0); }
function planCount(p){ return p.groups.reduce((s,g)=>s+(Number(g.count)||0),0); }
function useActivePlan(q){ const p=q.plans[q.planIdx]; q.groups=p.groups; q.terms=p.terms; }
function switchPlan(k){ const q=S.chaophi.current; q.planIdx=k; useActivePlan(q); render(); }
function clonePlan(p, name, kind){ return {id:'P'+(++_gid), name, kind, groups:JSON.parse(JSON.stringify(p.groups)), terms:JSON.parse(JSON.stringify(p.terms))}; }
function addPlan(){
  const q=S.chaophi.current;
  q.plans.push(clonePlan(q.plans[q.planIdx], 'Phương án '+(q.plans.filter(p=>p.kind==='option').length+1), 'option'));
  switchPlan(q.plans.length-1);
}
function removePlan(k){
  const q=S.chaophi.current; if(q.plans.length<2) return;
  if(q.chosenPlan===q.plans[k].id) q.chosenPlan=null;
  q.plans.splice(k,1); q.planIdx=Math.min(q.planIdx, q.plans.length-1); useActivePlan(q); render();
}
function setPlanField(k,f,v){ const q=S.chaophi.current; q.plans[k][f]=v; if(f==='kind' && v==='current' && q.chosenPlan===q.plans[k].id) q.chosenPlan=null; render(); }
function choosePlan(id){ const q=S.chaophi.current; q.chosenPlan = q.chosenPlan===id ? null : id; render(); }
function deltaChip(d){
  if(d==null) return '';
  if(Math.abs(d)<0.05) return '<span class="dchip">±0%</span>';
  return `<span class="dchip ${d>0?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d).toLocaleString('vi-VN',{maximumFractionDigits:1})}%</span>`;
}
function pctDiff(v,b){ return (v==null || !b) ? null : (v-b)/b*100; }
function renderPlanBar(q){
  const ap=q.plans[q.planIdx], bp=planPremium(q.plans[0]), chosen=q.chosenPlan===ap.id;
  return `
  <div class="card">
    <div class="plan-hd">
      <div><h3 style="margin:0 0 2px;">Phương án chào phí</h3><p class="sub" style="margin:0;">Mỗi phương án có nhóm khách hàng, quyền lợi & điều khoản riêng — phần khai báo bên dưới thuộc phương án đang chọn.</p></div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button class="btn btn-outline btn-sm" onclick="addPlan()" title="Nhân bản phương án đang chọn thành phương án mới">＋ Thêm phương án</button>
        ${q.plans.length>1 ? `<button class="btn btn-primary btn-sm" onclick="openCompare()">⇄ So sánh phương án</button>` : ''}
      </div>
    </div>
    <div class="plan-tabs">
      ${q.plans.map((p,k)=>{ const prem=planPremium(p); return `<div class="plan-tab ${k===q.planIdx?'active':''}" onclick="switchPlan(${k})">
        <div class="pt-name">${p.name}${p.kind==='current'?' <span class="chip">Hiện tại</span>':''}${q.chosenPlan===p.id?' <span class="chip green">✓ Đã chốt</span>':''}</div>
        <div class="pt-fee">${fmt(prem)} ${k?deltaChip(pctDiff(prem,bp)):''}</div>
        <div class="pt-sub">${p.groups.length} nhóm · ${planCount(p)} người</div>
      </div>`; }).join('')}
    </div>
    <div class="plan-edit">
      <input class="input" value="${ap.name}" title="Tên phương án" onchange="setPlanField(${q.planIdx},'name',this.value)">
      <select class="input" onchange="setPlanField(${q.planIdx},'kind',this.value)">
        <option value="option" ${ap.kind==='option'?'selected':''}>Phương án đề xuất</option>
        <option value="current" ${ap.kind==='current'?'selected':''}>Hợp đồng hiện tại (tham chiếu)</option>
      </select>
      ${ap.kind==='option' ? `<button class="btn ${chosen?'btn-ghost':'btn-outline'} btn-sm" onclick="choosePlan('${ap.id}')">${chosen?'Bỏ chốt':'✓ Chốt phương án này'}</button>` : ''}
      <span class="sp"></span>
      ${q.plans.length>1 ? `<span class="g-link danger" onclick="removePlan(${q.planIdx})">Xóa phương án</span>` : ''}
    </div>
  </div>`;
}
/* ---------- Bảng so sánh phương án ---------- */
function openCompare(){ const q=S.chaophi.current; S.chaophi.cmp={base:0, gid:(q.plans[0].groups[0]||{}).id}; render(); }
function closeCompare(){ S.chaophi.cmp=null; render(); }
function setCmp(k,v){ S.chaophi.cmp[k]=v; render(); }
function renderCompareModal(){
  const q=S.chaophi.current, c=S.chaophi.cmp, P=q.plans, B=P[c.base], disc=Number(q.discount)||0;
  const bc = k => k===c.base ? 'base' : '';
  const delta = (v,b,k) => k===c.base ? '' : deltaChip(pctDiff(v,b));
  const head = first => `<tr><th>${first}</th>${P.map((p,k)=>`<th class="${bc(k)}">${p.name}${p.kind==='current'?' <span class="chip">Hiện tại</span>':''}<div class="cmp-sub">${k===c.base?'Gốc so sánh':`<span class="g-link" onclick="setCmp('base',${k})">Đặt làm gốc</span>`}</div></th>`).join('')}</tr>`;
  // 1. Tổng quan
  const metrics = [
    ['Số nhóm khách hàng', p=>p.groups.length],
    ['Số người được bảo hiểm', planCount],
    ['Tổng phí gốc', planPremium, true],
    [`Tổng thanh toán (sau chiết khấu ${disc}%)`, p=>Math.round(planPremium(p)*(1-disc/100)), true],
    ['Số dòng khác gói chuẩn', p=>p.groups.reduce((s,g)=>s+groupDiffs(g).length,0)],
    ['Số điều khoản mở rộng', p=>EXT_CLAUSES.filter(x=>p.terms.ext[x.k]).length],
  ];
  const sumRows = metrics.map(([l,fn,money])=>`<tr><td>${l}</td>${P.map((p,k)=>{ const v=fn(p); return `<td class="${bc(k)} ${money?'money':''}">${money?fmt(v):v} ${money?delta(v,fn(B),k):''}</td>`; }).join('')}</tr>`).join('')
    + `<tr class="cmp-choose"><td>Chốt phương án gửi khách hàng</td>${P.map((p,k)=>`<td class="${bc(k)}">${p.kind==='current' ? '<span class="tiny-note">Tham chiếu</span>' : q.chosenPlan===p.id ? `<span class="chip green">✓ Đã chốt</span> <span class="g-link" onclick="choosePlan('${p.id}')">Bỏ</span>` : `<button class="btn btn-outline btn-sm" onclick="choosePlan('${p.id}')">Chốt</button>`}</td>`).join('')}</tr>`;
  // 2. Phí/người theo nhóm — ghép nhóm giữa các phương án theo id
  const gids = [...new Set(P.flatMap(p=>p.groups.map(g=>g.id)))];
  const gOf = (p,id) => p.groups.find(g=>g.id===id);
  const gname = id => { for(const p of P){ const g=gOf(p,id); if(g) return g.name; } return id; };
  const grpRows = gids.map(id=>`<tr><td>${gname(id)}</td>${P.map((p,k)=>{ const g=gOf(p,id), b=gOf(B,id); if(!g) return `<td class="${bc(k)} na">Không có nhóm</td>`;
      const v=groupFee(g).perPerson; return `<td class="${bc(k)} money">${fmt(v)} ${b?delta(v,groupFee(b).perPerson,k):''}<div class="cmp-sub">${g.count} người · ${presetById(g.preset).name}</div></td>`; }).join('')}</tr>`).join('');
  // 3. Quyền lợi của nhóm đang chọn
  const gid = gids.includes(c.gid) ? c.gid : gids[0];
  const codes = [...new Set(P.flatMap(p=>{ const g=gOf(p,gid); return g ? g.rows.map(r=>r.code) : []; }))].sort((a,b)=>cbOrder(a)-cbOrder(b));
  const siText = (g,code) => { if(!g) return null; const rs=g.rows.filter(r=>r.code===code); return rs.length ? rs.map(r=>fmt(r.si)+(rs.length>1?` <span class="cmp-sub">${r.from}–${r.to} tuổi</span>`:'')+(r.geo&&r.geo!==g.geo?` <span class="cmp-sub">${geoById(r.geo).label}</span>`:'')).join('<br>') : null; };
  const siMax = (g,code) => { const rs=g?g.rows.filter(r=>r.code===code):[]; return rs.length ? Math.max(...rs.map(r=>r.si)) : null; };
  const benRows = codes.map(code=>`<tr><td style="padding-left:${10+(cbDepth(code)-1)*14}px;"><span class="cb-code">${code}</span> ${cbItem(code).name}</td>${P.map((p,k)=>{ const g=gOf(p,gid), t=siText(g,code), b=gOf(B,gid);
      if(!t) return `<td class="${bc(k)} na ${k!==c.base&&siText(b,code)?'diff':''}">—</td>`;
      return `<td class="${bc(k)} ${k!==c.base&&siText(b,code)!==t?'diff':''}">${t} ${delta(siMax(g,code),siMax(b,code),k)}</td>`; }).join('')}</tr>`).join('');
  // 4. Điều khoản
  const waits = [['waitAcc','Tai nạn'],['waitIll','Bệnh thông thường'],['waitSpecial','Bệnh đặc biệt, bệnh có sẵn'],['waitMa','Thai sản']];
  const exts = EXT_CLAUSES.filter(x=>P.some(p=>p.terms.ext[x.k]));
  const tRow = (label, fn) => `<tr><td>${label}</td>${P.map((p,k)=>{ const t=fn(p); return `<td class="${bc(k)} ${t==='—'?'na':''} ${k!==c.base&&t!==fn(B)?'diff':''}">${t}</td>`; }).join('')}</tr>`;
  const termRows = waits.map(([k,l])=>tRow('Thời gian chờ — '+l, p=>p.terms[k]||'—')).join('') + exts.map(x=>tRow(x.label, p=>p.terms.ext[x.k]?'✓':'—')).join('');
  const tbl = (first, body) => `<div class="bt-wrap"><table class="cmp-tbl" style="min-width:${260+P.length*170}px;"><thead>${head(first)}</thead><tbody>${body}</tbody></table></div>`;
  return `<div class="modal-overlay" onclick="if(event.target===this) closeCompare()"><div class="modal-box" style="max-width:1240px;">
    <span class="modal-close" onclick="closeCompare()">✕</span>
    <h3 style="margin:0 0 4px;">So sánh phương án chào phí</h3>
    <p class="sub" style="margin:0 0 4px;">${q.company||q.id} · ${P.length} phương án · gốc so sánh: <b>${B.name}</b> · ô cam: khác gốc · ▲▼: chênh lệch so với gốc</p>
    <div class="cmp-sec">1. Tổng quan</div>${tbl('Chỉ tiêu', sumRows)}
    <div class="cmp-sec">2. Phí/người theo nhóm khách hàng</div>${tbl('Nhóm khách hàng', grpRows)}
    <div class="cmp-sec">3. Quyền lợi theo nhóm <span class="cmp-gsel">${gids.map(id=>`<span class="fpill ${id===gid?'active':''}" onclick="setCmp('gid','${id}')">${gname(id)}</span>`).join('')}</span></div>${tbl('Quyền lợi — STBH', benRows)}
    <div class="cmp-sec">4. Điều khoản</div>${tbl('Điều khoản', termRows)}
    <div class="actions-row" style="margin-top:18px;">
      <button class="btn btn-ghost" onclick="closeCompare()">Đóng</button>
      <button class="btn btn-outline" onclick="window.print()">🖨 In bảng so sánh</button>
    </div>
  </div></div>`;
}

function updateTerm(v){ S.chaophi.current.termMonths=Number(v); render(); }
function updateEffDate(v){ S.chaophi.current.effDate=v; render(); }
function updateDiscount(v){ S.chaophi.current.discount=Number(v); render(); }
function updateRebate(v){ S.chaophi.current.rebate=Number(v); render(); }
/* ---------- Nhóm khách hàng ---------- */
function numFmt(n){ return (Number(n)||0).toLocaleString('vi-VN'); }
function parseMoney(v){ return Number(String(v).replace(/\D/g,''))||0; }
function shortMoney(n){
  n=Number(n)||0;
  if(n>=1e9) return (n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ';
  if(n>=1e6) return (n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tr';
  return fmt(n);
}
function grp(i){ return S.chaophi.current.groups[i]; }

function duplicateGroup(i){
  const q=S.chaophi.current; const c=JSON.parse(JSON.stringify(q.groups[i]));
  c.id='G'+(++_gid); c.name=c.name+' (bản sao)'; q.groups.forEach(g=>g._open=false); c._open=true;
  q.groups.splice(i+1,0,c); render();
}
function removeGroup(i){ S.chaophi.current.groups.splice(i,1); render(); }

function changePreset(i,id){

function resetGroup(i){ const g=grp(i); g.rows=JSON.parse(JSON.stringify(presetById(g.preset).rows)); render(); }
// mở 1 nhóm thì các nhóm khác tự thu gọn — tránh màn hình dài khi có nhiều nhóm
function toggleGroupOpen(i){ const g=grp(i); const v=!g._open; S.chaophi.current.groups.forEach(x=>x._open=false); g._open=v; render(); }
function setAllGroupsOpen(v){ S.chaophi.current.groups.forEach(g=>g._open=v); render(); }
function filterGroups(v){
  S.chaophi.groupFilter=v;

  document.querySelectorAll('.group-card[data-s]').forEach(el=>{ el.style.display = el.dataset.s.includes(s) ? '' : 'none'; });
