function opSetActiveRole(r){ S.orgPortal.activeRole=r; S.orgPortal.rosterSearch=''; S.orgPortal.rosterPage=1; S.orgPortal.distSearch=''; S.orgPortal.distPage=1; render(); }
function renderOrgProgramsTab(org){
  const parent = org.parentId ? opFind(org.parentId) : null;
  if(org.programs.length===0){
    return `<div class="card">
      <h3>🛡️ Vai trò & Chương trình bảo hiểm</h3>
      ${parent ? `<div class="notice info">Nhân sự của ${org.name} hiện đang được bảo hiểm theo chương trình chung của đơn vị chủ quản <b>${parent.name}</b>. <a href="javascript:void(0)" onclick="openOrgDetail('${parent.id}');setOrgDetailTab('programs')" style="color:var(--bg-3);">Xem chương trình gốc →</a></div>`
      : `<div class="empty-state">Chưa có chương trình bảo hiểm nào được gán cho pháp nhân này.</div>`}
    </div>`;
  }
  const conflict = (function(){
    const types = org.roles;
    if(!types.includes('BMBH') || !types.includes('DAILY')) return null;
    const bmbh = org.programs.find(p=>p.type==='BMBH');
    const daily = org.programs.find(p=>p.type==='DAILY');
    if(!bmbh || !daily) return null;
    const fam = id => (id.split('-')[1]||id);
    return { sameFamily: fam(bmbh.programId)===fam(daily.programId) };
  })();
  const activeRole = S.orgPortal.activeRole || org.roles[0];
  return `
  <div class="card">
    <h3>🧩 Vai trò hợp tác với PTI</h3>
    <p class="sub">Mỗi vai trò gắn một chương trình riêng biệt — không dùng chung dữ liệu vận hành với vai trò khác. Bấm vào một vai trò để xem cấu phần vận hành tương ứng.</p>
    ${org.roles.length ? '' : `<div class="notice info">ℹ️ Đơn vị chưa tham gia nghiệp vụ nào — vai trò & chương trình được gán khi đơn vị tham gia nghiệp vụ cụ thể.</div>`}
    ${org.roles.length>1 ? `<div class="notice info">ℹ️ Pháp nhân này đang đồng thời giữ <b>${org.roles.length} vai trò</b> khác nhau trên cùng một Org ID.</div>` : ''}
    ${conflict ? (conflict.sameFamily
      ? `<div class="notice warn">⚠ Cảnh báo xung đột lợi ích: 2 vai trò đang thuộc cùng dòng sản phẩm — không tính hoa hồng đại lý cho hợp đồng mà chính pháp nhân này là bên mua bảo hiểm.</div>`
      : `<div class="notice success">✓ Đã đối soát: 2 vai trò thuộc 2 dòng sản phẩm khác nhau — không phát sinh xung đột hoa hồng trực tiếp.</div>`)
    : ''}
    <table class="pti">
      <thead><tr><th>Vai trò</th><th>Mã chương trình (Sales Program ID)</th><th>Số hợp đồng / HĐ khung</th><th>Thời hạn hiệu lực</th><th>Trạng thái</th></tr></thead>
      <tbody>
        ${org.programs.map(p=>`
        <tr style="cursor:pointer;${activeRole===p.type?'background:#f3f6ff;':''}" onclick="opSetActiveRole('${p.type}')">
          <td><span class="chip" style="background:var(--info-bg);color:var(--bg-3);">${ROLE_META[p.type].label}</span></td>
          <td>${p.programId}</td><td>${p.contractNo}</td>
          <td>${p.effFrom? fmtDateVN(p.effFrom)+' – '+fmtDateVN(p.effTo) : '—'}</td>
          <td>${p.status==='active' ? '<span class="status-pill status-done">● Đang hiệu lực</span>' : '<span class="status-pill status-cho">● Chờ kích hoạt</span>'}</td>
        </tr>
        ${p.status==='pending' && p.pendingReason ? `<tr><td colspan="5"><div class="notice warn" style="margin:0;">⏳ ${p.pendingReason}</div></td></tr>`:''}
        `).join('')}
      </tbody>
    </table>
  </div>

  ${org.roles.length>1 ? `
  <div class="filter-pills" style="margin-bottom:4px;">
    ${org.roles.map(r=>`<div class="fpill ${activeRole===r?'active':''}" onclick="opSetActiveRole('${r}')">${ROLE_META[r].label}</div>`).join('')}
  </div>` : ''}

  ${activeRole==='BMBH' ? renderBmbhSection(org) : ''}
  ${activeRole==='DAILY' ? renderAgentSection(org) : ''}
  `;
}
function paginate(list, page, term, matchFn){
  const filtered = term ? list.filter(item=>matchFn(item, term.toLowerCase())) : list;
  const totalPages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
  const p = Math.min(page, totalPages);
  const start = (p-1)*PAGE_SIZE;
  return { rows: filtered.slice(start, start+PAGE_SIZE), total: filtered.length, totalPages, page:p };
}
function renderPaginationControls(page, totalPages, total, onPrev, onNext){
  if(total<=PAGE_SIZE) return `<div class="tiny-note" style="margin-top:8px;">${total} dòng</div>`;
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
    <span class="tiny-note">Trang ${page}/${totalPages} · ${total} dòng</span>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-outline btn-sm" ${page<=1?'disabled':''} onclick="${onPrev}">‹ Trước</button>
      <button class="btn btn-outline btn-sm" ${page>=totalPages?'disabled':''} onclick="${onNext}">Sau ›</button>
    </div>
  </div>`;
}

      <thead><tr><th>Họ và tên</th><th>Mã định danh (Party ID)</th><th>Gói bảo hiểm</th><th>Số GCN</th><th>Trạng thái GCN</th></tr></thead>
      <tbody>
        ${rows.length? rows.map(m=>`<tr><td>${m.name}</td><td>${m.partyId}</td><td>${m.pkg}</td><td>${m.gcn||'—'}</td><td>${m.gcnStatus==='issued'?'<span class="status-pill status-done">✓ Đã cấp GCN</span>':'<span class="status-pill status-cho">● Chờ cấp GCN</span>'}</td></tr>`).join('') : `<tr><td colspan="5"><div class="empty-state">Không tìm thấy đối tượng bảo hiểm phù hợp.</div></td></tr>`}

    ${renderPaginationControls(page, totalPages, total, `opChangeRosterPage(${page-1})`, `opChangeRosterPage(${page+1})`)}

function opCloseModal(){ S.orgPortal.modal=null; render(); }
function renderOrgPortalModal(){
  const m = S.orgPortal.modal;
  const org = opFind(m.orgId);
  if(m.type==='addStaff') return renderStaffFormModal(org, null, 'Thêm nhân sự mới');
  if(m.type==='editStaff') return renderStaffFormModal(org, org.staff.find(s=>s.empId===m.staffId), 'Chỉnh sửa thông tin nhân sự');
  if(m.type==='transferStaff') return renderTransferModal(org, [m.staffId]);
  if(m.type==='bulkTransfer'){
    const ids = Object.keys(S.orgPortal.selectedStaff).filter(k=>S.orgPortal.selectedStaff[k]);

  if(m.type==='addBranch') return renderAddBranchModal(org);
  if(m.type==='import') return renderImportModal(org);
  return '';
}

function opSaveStaff(orgId, empId){
  const org = opFind(orgId);
  const name = document.getElementById('sf-name').value.trim();
  const title = document.getElementById('sf-title').value.trim() || 'Chưa cập nhật';
  const dept = document.getElementById('sf-dept').value.trim() || 'Chưa cập nhật';
  const phone = document.getElementById('sf-phone').value.trim() || '—';
  const email = document.getElementById('sf-email').value.trim() || '—';
  if(!name){ return; }
  if(empId){

  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!_xlsxP) _xlsxP = new Promise((res,rej)=>{

function impCell(v){
  const p=n=>String(n).padStart(2,'0');
  if(v instanceof Date) return p(v.getDate())+'/'+p(v.getMonth()+1)+'/'+v.getFullYear();
  return String(v==null?'':v).trim();
}
function impParseCSV(t){
  t=t.replace(/^﻿/,''); const first=t.split('\n')[0];
  const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length ? ';' : ',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===sep){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur.replace(/\r$/,'')); rows.push(row); row=[]; cur=''; }
    else cur+=ch;
  }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
// Dò dòng tiêu đề = dòng khớp nhiều tên cột nhất (bỏ qua dòng ghi chú phía trên), khớp cột theo tên — không phụ thuộc thứ tự cột
function impMapHeader(row){
  const map={};
  row.forEach((h,ci)=>{ const n=normVN(h); if(!n || n.length>60) return; const c=IMP_COLS.find(c=>!(c.k in map) && c.keys.some(k=>n.includes(k))); if(c) map[c.k]=ci; });
  return map;
}
function impParseAOA(aoa){
  let hi=-1, map={};
  aoa.slice(0,15).forEach((r,i)=>{ const m=impMapHeader(r); if(Object.keys(m).length>Object.keys(map).length){ map=m; hi=i; } });
  if(hi<0 || !('name' in map) || Object.keys(map).length<3) return {err:'Không tìm thấy dòng tiêu đề — file cần có các cột như Mã số nhân viên, Họ và tên, Số giấy tờ.'};
  const rows=[];
  aoa.slice(hi+1).forEach((r,ri)=>{
    const o={line:hi+ri+2}; IMP_COLS.forEach(c=>{ o[c.k] = c.k in map ? impCell(r[map[c.k]]) : ''; });
    if(o.name || o.empId) rows.push(o);
  });
  if(!rows.length) return {err:'File không có dòng nhân sự nào.'};
  return {rows};
}
async function impReadFile(input){
  const f=input.files[0]; if(!f) return;
  const st=S.orgPortal.imp; st.fileName=f.name; st.err='';

    if(/\.csv$/i.test(f.name)) aoa = impParseCSV(await f.text());
    else { const X=await impLoadXLSX(); const wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:true}); aoa=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true}); }
    const r=impParseAOA(aoa);
    if(r.err) st.err=r.err; else { st.rows=r.rows; st.stage='preview'; st.onlyErr=false; }
  }catch(e){
    st.err = e.message==='offline' ? 'Không tải được bộ đọc Excel (cần kết nối mạng). Hãy lưu file dạng CSV hoặc dùng dữ liệu mẫu.' : 'Không đọc được file: '+e.message;

  render();

function impSubtree(org){ const out=[org]; opChildren(org.id).forEach(k=>out.push(...impSubtree(k))); return out; }
function impRoot(org){ let o=org; while(o.parentId && opFind(o.parentId)) o=opFind(o.parentId); return o; }
// So khớp tên đơn vị bỏ qua các từ chung: "OCB Chi nhánh Hải Phòng" ≡ "OCB Hải Phòng", "Miền Bắc" ≡ "OCB Miền Bắc"
function impUnitKey(s){ return normVN(s).replace(/\b(chi nhanh|phong giao dich|pgd|cn)\b/g,' ').replace(/\s+/g,' ').trim(); }
function impFindUnit(parentId, code, name, created){
  const n=impUnitKey(name), c=normVN(code);
  const pool=[...opChildren(parentId), ...created.filter(u=>u.parentId===parentId)];
  return pool.find(u=>(c && normVN(u.unitCode)===c) || (n && (impUnitKey(u.name)===n || impUnitKey(u.name).endsWith(' '+n))));
}
// Lập kế hoạch import (không ghi dữ liệu): kiểm tra từng dòng, xác định đơn vị đích & thao tác
function impPlan(org, rows){
  const created=[], seenEmp={}, seenId={};
  const staffAll = impSubtree(org).flatMap(u=>u.staff.map(s=>({s,u})));
  const plan = rows.map(r=>{
    const del = /xoa/.test(normVN(r.op)), errs=[];
    if(del){ if(!r.empId && !r.idNo) errs.push('Thiếu mã NV hoặc số giấy tờ'); }
    else {
      IMP_COLS.filter(c=>c.req && !r[c.k]).forEach(c=>errs.push('Thiếu '+c.h.replace(' (*)','').toLowerCase()));
      if(r.phone && !/^0\d{8,10}$/.test(r.phone.replace(/[\s.]/g,''))) errs.push('SĐT không hợp lệ');
    }
    if(r.empId){ if(seenEmp[r.empId]) errs.push('Trùng mã NV với dòng '+seenEmp[r.empId]); else seenEmp[r.empId]=r.line; }
    if(r.idNo){ if(seenId[r.idNo]) errs.push('Trùng số giấy tờ với dòng '+seenId[r.idNo]); else seenId[r.idNo]=r.line; }
    let parentId=org.id; const path=[];
    [['', r.region], [r.unitCode, r.unitName]].forEach(([code,name])=>{
      if(!code && !name) return;
      let u = impFindUnit(parentId, code, name, created);
      if(!u){ u={id:'NEW-'+created.length+'-'+r.line, parentId, name:name||code, unitCode:code, isNew:true}; if(!errs.length) created.push(u); }
      path.push({name:u.name, isNew:!!u.isNew}); parentId=u.id;
    });
    const ex = staffAll.find(x=>(r.empId && x.s.empId===r.empId) || (r.idNo && x.s.idNo===r.idNo));
    if(del && !ex && !errs.length) errs.push('Không tìm thấy nhân sự để xóa');
    const act = errs.length ? 'error' : del ? 'delete' : ex ? 'update' : 'new';
    return {...r, errs, act, path, targetId:parentId, exist:ex};
  });
  return {plan, created};
}
function impApply(orgId){
  const org=opFind(orgId), st=S.orgPortal.imp, {plan, created}=impPlan(org, st.rows);
  const root=impRoot(org), baseMst=String(root.mst).split('-')[0], idMap={}, touched={};
  let nNew=0, nUpd=0, nDel=0;
  created.forEach(u=>{
    const parent = idMap[u.parentId] || opFind(u.parentId);
    let i=opChildren(parent.id).length+1; while(opFind(parent.id+'-C'+i)) i++;
    const id=parent.id+'-C'+i, seq=impSubtree(root).length;
    opOrgs().push({id, custType:parent.custType, parentId:parent.id, name:u.name, fullName:u.name, unitCode:u.unitCode||'',
      mst:baseMst+'-'+String(seq).padStart(3,'0'), unitType:'Đơn vị trực thuộc cấp '+(parent.level+1), level:parent.level+1,
      contact:'Chưa cập nhật', phone:'—', email:'—', address:'Chưa cập nhật', roles:[], staff:[], programs:[]});
    idMap[u.id]=opFind(id); S.orgPortal.expanded[parent.id]=true;
  });
  plan.filter(p=>p.act!=='error').forEach(p=>{
    const target = idMap[p.targetId] || opFind(p.targetId);
    const rec = {empId:p.empId, name:p.name, title:p.title||'Chưa cập nhật', dept:p.dept||'Chưa cập nhật', phone:p.phone||'—', email:p.email||'—',
      gender:p.gender, dob:p.dob, idType:p.idType, idNo:p.idNo, addr:p.addr};
    const drop = x=>x.u.staff.splice(x.u.staff.indexOf(x.s),1);
    if(p.act==='delete'){ drop(p.exist); nDel++; return; }
    if(p.act==='update'){ Object.assign(p.exist.s, rec); if(p.exist.u!==target){ drop(p.exist); target.staff.push(p.exist.s); } nUpd++; }
    else { target.staff.push(rec); nNew++; }
    touched[target.id]=(touched[target.id]||0)+1;
  });
  const nErr=plan.filter(p=>p.act==='error').length;
  opLogActivity('Import cơ cấu & nhân sự', `${org.name} — ${created.length} đơn vị mới, ${nNew} nhân sự mới, ${nUpd} cập nhật${nDel?', '+nDel+' xóa':''}${nErr?', bỏ qua '+nErr+' dòng lỗi':''}`);
  st.result={nUnits:created.length, nNew, nUpd, nDel, nErr, units:Object.entries(touched).map(([id,n])=>({id,n}))};
  st.stage='done'; render();
}

  const st=S.orgPortal.imp, wide=st.stage==='preview';
  const shell=(body,foot)=>`<div class="modal-overlay" onclick="if(event.target===this) opCloseModal()"><div class="modal-box" style="max-width:${wide?1100:620}px;width:96%;max-height:92vh;overflow:auto;">
    <span class="modal-close" onclick="opCloseModal()">✕</span>${body}
    <div class="actions-row" style="margin-top:18px;justify-content:flex-end;">${foot}</div></div></div>`;
  const ACT={new:['Thêm mới','var(--success-bg)','var(--success)'], update:['Cập nhật','var(--info-bg)','var(--bg-3)'], delete:['Xóa','var(--warning-bg)','var(--warning)'], error:['Lỗi','var(--danger-bg)','var(--danger)']};
  const chip=(t,a)=>`<span class="chip" style="background:${ACT[a][1]};color:${ACT[a][2]};">${t}</span>`;

  if(st.stage==='upload') return shell(`
    <h3 style="margin:0 0 4px;">Import cơ cấu tổ chức & nhân sự</h3>
    <p class="sub">Đơn vị chủ quản: <b>${org.name}</b> (${org.id}). Một file gồm cả đơn vị trực thuộc và nhân sự — đơn vị chưa có sẽ được tạo mới.</p>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px;">
      <div><b style="font-size:13px;">1. Tải file mẫu</b><div class="tiny-note">Bắt buộc: Mã số nhân viên, Họ và tên, Ngày sinh, Loại giấy tờ, Số giấy tờ, Số điện thoại. Để trống Vùng / Đơn vị → nhân sự thuộc trực tiếp ${org.name}.</div></div>
      <button class="btn btn-outline btn-sm" style="white-space:nowrap;" onclick="impDownloadTemplate()">${icon_import()} Tải file mẫu</button>
    </div>
    <b style="font-size:13px;">2. Chọn file danh sách</b>
    <label class="doc-drop" style="margin-top:8px;flex-direction:column;gap:6px;">${ICON_UP}<span>Bấm để chọn file <b>.xlsx</b> hoặc <b>.csv</b></span>
      <span class="tiny-note">Nhận cả file theo "Template import user ID" của đối tác — cột nghiệp vụ (Kiểu khai thác, Loại người dùng) được bỏ qua.</span>
      <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="impReadFile(this)"></label>
    ${st.err?`<div class="notice danger" style="margin-top:12px;">⚠ ${st.err}</div>`:''}
    <div class="tiny-note" style="margin-top:10px;">Chưa có file? <a href="javascript:void(0)" style="color:var(--bg-3);font-weight:700;" onclick="impUseSample()">Dùng dữ liệu mẫu</a></div>`,
    `<button class="btn btn-ghost" onclick="opCloseModal()">Hủy</button>`);

  if(st.stage==='preview'){
    const {plan, created}=impPlan(org, st.rows);
    const cnt=a=>plan.filter(p=>p.act===a).length, nErr=cnt('error'), ok=plan.length-nErr;
    const rows=plan.filter(p=>!st.onlyErr || p.act==='error');
    const unitCell=p=>p.path.length ? p.path.map(x=>x.name+(x.isNew?' <span class="chip" style="background:#eef3ff;color:var(--bg-3);padding:1px 7px;">mới</span>':'')).join(' <span style="color:var(--ink-faint);">›</span> ') : `<span class="tiny-note">${org.name}</span>`;
    return shell(`
      <h3 style="margin:0 0 4px;">Kiểm tra dữ liệu import</h3>
      <p class="sub">📄 ${st.fileName} · ${plan.length} dòng nhân sự · đơn vị chủ quản ${org.name}</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
        <span class="chip" style="background:#eef3ff;color:var(--bg-1);">${created.length} đơn vị mới</span>
        ${chip(cnt('new')+' nhân sự mới','new')}${chip(cnt('update')+' cập nhật','update')}${cnt('delete')?chip(cnt('delete')+' xóa','delete'):''}${chip(nErr+' dòng lỗi','error')}
      </div>
      ${created.length?`<div class="notice info" style="margin-bottom:12px;">🏢 <div>Đơn vị trực thuộc sẽ tạo mới: ${created.map(u=>'<b>'+u.name+'</b>').join(', ')} — chưa gắn nghiệp vụ.</div></div>`:''}
      ${nErr?`<label class="checkline" style="margin:0 0 10px;"><input type="checkbox" ${st.onlyErr?'checked':''} onchange="S.orgPortal.imp.onlyErr=this.checked;render()"> Chỉ hiện dòng lỗi</label>`:''}
      <div style="overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:12px;">
        <table class="pti" style="margin:0;"><thead><tr><th>Dòng</th><th>Đơn vị</th><th>Mã NV</th><th>Họ và tên</th><th>Giấy tờ</th><th>Số điện thoại</th><th>Chức danh</th><th>Kết quả</th></tr></thead><tbody>
        ${rows.map(p=>`<tr ${p.act==='error'?'style="background:#fff7f7;"':''}>
          <td>${p.line}</td><td>${unitCell(p)}</td><td style="white-space:nowrap;"><b>${p.empId||'—'}</b></td><td>${p.name||'—'}</td>
          <td>${p.idNo?`${p.idType} ${p.idNo}`:'—'}</td><td>${p.phone||'—'}</td><td>${p.title||'—'}</td>
          <td>${chip(ACT[p.act][0],p.act)}${p.errs.length?`<div class="tiny-note" style="color:var(--danger);margin-top:4px;">${p.errs.join(' · ')}</div>`:''}</td></tr>`).join('')}
        </tbody></table></div>`,
      `<button class="btn btn-ghost" onclick="S.orgPortal.imp.stage='upload';render()">← Chọn file khác</button>
       <button class="btn btn-primary" ${ok?'':'disabled'} onclick="impApply('${org.id}')">Import ${ok} dòng hợp lệ${nErr?` · bỏ qua ${nErr} dòng lỗi`:''}</button>`);
  }

  const r=st.result;
  return shell(`
    <div style="text-align:center;">${icon3d('<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="40" height="40"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>','green')}
      <h3 style="margin:0 0 4px;">Import hoàn tất</h3><p class="sub">${org.name}</p></div>
    <div class="sx-tbl">
      <div class="sx-row"><span>Đơn vị trực thuộc tạo mới</span><b>${r.nUnits}</b></div>
      <div class="sx-row"><span>Nhân sự thêm mới</span><b>${r.nNew}</b></div>
      <div class="sx-row"><span>Nhân sự cập nhật</span><b>${r.nUpd}</b></div>
      ${r.nDel?`<div class="sx-row"><span>Nhân sự xóa</span><b>${r.nDel}</b></div>`:''}
      <div class="sx-row"><span>Dòng lỗi bỏ qua</span><b>${r.nErr}</b></div>
    </div>
    ${r.units.length?`<div class="f-label">Nhân sự theo đơn vị</div>
    ${r.units.map(u=>{ const o=opFind(u.id); return `<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed #eef1fb;padding:8px 0;font-size:12.8px;">
      <span><b>${o.name}</b> <span class="tiny-note">${o.id}</span></span>
      <span style="display:flex;align-items:center;gap:10px;">${u.n} nhân sự <button class="btn btn-outline btn-sm" onclick="opCloseModal();openOrgDetail('${o.id}');setOrgDetailTab('staff')">Xem →</button></span></div>`; }).join('')}`:''}`,
    `<button class="btn btn-outline" onclick="opCloseModal();setOrgDetailTab('relations')">Xem cơ cấu tổ chức</button>
     <button class="btn btn-primary" onclick="opCloseModal()">Đóng</button>`);
}

/* ======================= INIT ======================= */
// Chuẩn hóa hồ sơ chào phí mẫu theo cấu trúc nhóm khách hàng
// Demo hồ sơ tái tục: hợp đồng hiện tại + 2 phương án (như sheet QuyenloiEB: 2025-2026 / PA1 / PA2)
(function seedPlans(){
  const q=findQuote('PTI-CARE-DFT-5856'); hydrateQuote(q);
  const pa1=q.plans[0];
  const cur=clonePlan(pa1, 'Hiện tại 2025-2026', 'current');
  cur.groups.forEach(g=>g.rows.forEach(r=>{ r.si=Math.round(r.si*0.85/10000)*10000; }));
  EXT_CLAUSES.forEach((x,i)=>{ cur.terms.ext[x.k] = i<5; });
  const pa2=clonePlan(pa1, 'Phương án 2', 'option');
  pa2.groups.forEach(g=>{ g.rows.forEach(r=>{ if(r.code.startsWith('QLTN')) r.si=Math.round(r.si*1.2); }); g.rows.push(newRow('QLSK.06',g)); sortRows(g.rows); });
  pa2.terms.ext.vaccine=true;
  q.plans=[cur, pa1, pa2]; q.planIdx=1; useActivePlan(q);
})();
S.chaophi.quotes.forEach(q=>{ hydrateQuote(q); q.premium=computeQuotePremium(q); q.employees=q.groups.reduce((s,g)=>s+Number(g.count||0),0); });
render();
</script>
</body>
