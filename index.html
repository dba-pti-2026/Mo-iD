function normVN(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').toLowerCase().trim(); }
function renameGroup(i,v){ grp(i).name=v; render(); }
/* ---------- Bảng quyền lợi động: mỗi dòng = 1 quyền lợi Codebook × 1 băng tuổi ---------- */
function setRow(i,ri,k,v){ const r=grp(i).rows[ri]; r[k] = (k==='pay'||k==='geo') ? v : (k==='si' ? parseMoney(v) : Number(v)||0); render(); }
function dupRow(i,ri){ const rows=grp(i).rows; rows.splice(ri+1,0,Object.assign({},rows[ri])); render(); }
function delRow(i,ri){ grp(i).rows.splice(ri,1); render(); }
/* ---------- Popup chọn quyền lợi từ Codebook ---------- */
// ri: dòng đang đổi quyền lợi (chọn 1) · không truyền ri: thêm dòng mới (chọn nhiều)
function openCodebook(i, ri){ S.chaophi.cbModal={gi:i, ri:ri==null?null:ri, sel:[], all:false}; render(); setTimeout(()=>{ const el=document.getElementById('cbSearch'); if(el) el.focus(); },0); }
function closeCodebook(){ S.chaophi.cbModal=null; render(); }
function cbSearch(v){

  document.querySelectorAll('.cb-cat').forEach(h=>{ const any=[...document.querySelectorAll(`.cb-item[data-cat="${h.dataset.cat}"]`)].some(el=>el.style.display!=='none'); h.style.display=any?'':'none'; });
  document.getElementById('cbEmpty').style.display = shown ? 'none' : '';

function cbToggle(code, el){
  const m=S.chaophi.cbModal;
  m.sel = m.sel.includes(code) ? m.sel.filter(x=>x!==code) : m.sel.concat(code);
  el.classList.toggle('on', m.sel.includes(code));
  el.querySelector('input').checked = m.sel.includes(code);
  document.getElementById('cbCount').textContent = m.sel.length;
  document.getElementById('cbAdd').disabled = !m.sel.length;
}
function cbPick(code){
  const m=S.chaophi.cbModal; const r=grp(m.gi).rows[m.ri]; const c=cbItem(code);
  Object.assign(r, {code, pay:c.pay||'', rate:c.rate||0});
  if(!r.si) r.si=c.si||0;
  S.chaophi.cbModal=null; render();
}
function cbApply(){
  const m=S.chaophi.cbModal; const q=S.chaophi.current;
  const targets = m.all ? q.groups : [q.groups[m.gi]];
  targets.forEach(g=>{ m.sel.forEach(code=>g.rows.push(newRow(code,g))); sortRows(g.rows); });
  S.chaophi.cbModal=null; render();
}
function renderCodebookModal(){

    <input class="input" id="cbSearch" placeholder="Tìm theo mã hoặc tên quyền lợi — VD: QLTN.01, nội trú, thương tật" oninput="cbSearch(this.value)" style="margin-bottom:6px;">
    <div class="cb-list">

    </div>
    ${single ? `<div class="cb-foot"><span class="tiny-note" style="margin:0;">Bấm vào quyền lợi để chọn. STBH đang nhập được giữ nguyên.</span><button class="btn btn-ghost btn-sm" onclick="closeCodebook()">Hủy</button></div>` : `
    ${q.groups.length>1 ? `<label class="chk" style="margin-top:12px;"><input type="checkbox" ${m.all?'checked':''} onchange="S.chaophi.cbModal.all=this.checked"> Thêm cho tất cả ${q.groups.length} nhóm khách hàng</label>` : ''}
    <div class="cb-foot">
      <span class="tiny-note" style="margin:0;">Đã chọn <b id="cbCount">${m.sel.length}</b> quyền lợi · mỗi quyền lợi thêm 1 dòng, nhân bản dòng để khai thêm băng tuổi</span>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost btn-sm" onclick="closeCodebook()">Hủy</button>
        <button class="btn btn-primary btn-sm" id="cbAdd" ${m.sel.length?'':'disabled'} onclick="cbApply()">Thêm dòng</button>
      </div>
    </div>`}
  </div></div>`;
}

function renderGroupCard(g,i){
  const f = groupFee(g);
  const diffs = groupDiffs(g);
  const p = presetById(g.preset);
  // chip tóm tắt: quyền lợi chính (có nhãn ngắn trong Codebook), lấy STBH cao nhất nếu có nhiều băng tuổi
  const main = {}; g.rows.forEach(r=>{ const c=cbItem(r.code); if(c.s) main[c.s]=Math.max(main[c.s]||0, r.si); });
  const flt = normVN(S.chaophi.groupFilter);
  const searchKey = normVN(g.name+' '+(g.title||'')+' '+presetLabel(p));
  const acts = `<div class="gc-acts" onclick="event.stopPropagation()">
        <span class="g-link" onclick="duplicateGroup(${i})">⧉ Nhân bản</span>
        ${S.chaophi.current.groups.length>1 ? `<span class="g-link danger" onclick="removeGroup(${i})"><svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Xóa</span>` : ''}
      </div>`;
  return `
  <div class="group-card ${g._open?'open':'collapsed'}" data-s="${searchKey}" style="${flt && !searchKey.includes(flt)?'display:none;':''}">
    <div class="gc-row" onclick="toggleGroupOpen(${i})" title="${g._open?'Thu gọn':'Mở rộng để khai báo'}">
      <span class="gc-caret">▶</span>
      <div class="gc-main">

          ${diffs.length ? `<span class="chip">Khác gói chuẩn: ${diffs.length} dòng</span>` : ''}
        </div>
        <div class="gc-meta"><b>${g.count}</b> người · ${presetLabel(p)} · ${geoById(g.geo).label} · ${g.rows.length} dòng quyền lợi${g.title?' · '+g.title:''}</div>
      </div>
      <div class="gc-fee"><div class="v">${fmt(f.total)}</div><div class="s">${fmt(f.perPerson)} × ${g.count} người</div></div>
      ${acts}
    </div>
    ${g._open ? '' : `<div class="g-sum">${Object.entries(main).map(([k,v])=>`<span>${k}: ${shortMoney(v)}</span>`).join('')}</div>`}
    ${g._open ? `
    <div class="group-head g3">
      <div><label class="f-label">Tên nhóm khách hàng</label><input class="input" value="${g.name}" onchange="renameGroup(${i},this.value)"></div>
      <div><label class="f-label">Số người</label><input class="input" type="number" min="1" value="${g.count}" onchange="updateGroup(${i},'count',this.value)"></div>
      <div><label class="f-label">Gói quyền lợi chuẩn</label>
        <select class="input" onchange="changePreset(${i},this.value)">
          ${PRESETS.map(x=>`<option value="${x.id}" ${x.id===g.preset?'selected':''}>${presetLabel(x)} — ${fmt(x.fee)}/người</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="group-sub">
      <div><label class="f-label">Cấp bậc / chức danh áp dụng</label><input class="input" value="${g.title||''}" placeholder="VD: Tổng giám đốc, Chủ tịch HĐQT" onchange="setGroupField(${i},'title',this.value)"></div>
      <div><label class="f-label">Độ tuổi tham gia</label>
        <div class="age-pair"><input class="input" type="number" min="0" value="${g.ageFrom}" onchange="setGroupField(${i},'ageFrom',this.value)"><span>–</span><input class="input" type="number" min="0" value="${g.ageTo}" onchange="setGroupField(${i},'ageTo',this.value)"></div>
      </div>
      <div><label class="f-label">Phạm vi địa lý</label>
        <select class="input" onchange="setGroupField(${i},'geo',this.value)">${GEO_SCOPES.map(x=>`<option value="${x.id}" ${x.id===g.geo?'selected':''}>${x.label} · phí ×${x.factor}</option>`).join('')}</select>
      </div>
    </div>
    ${renderBenefitTable(g,i)}` : ''}
  </div>`;
}
const IC_COPY = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="1.8"/></svg>';
const IC_TRASH = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// Bảng quyền lợi chia 2 lớp: 5 quyền lợi chính luôn hiện, quyền lợi bổ sung thu gọn; hạn mức con mở bên trong từng quyền lợi
const MAIN_BEN = ['QLTN.01','QLTN.02','QLSK.01','QLSK.02','QLSK.04'];
const benTop = code => code.split('.').slice(0,2).join('.');
function toggleBenTop(i,code){ const g=grp(i); g._exp=g._exp||{}; g._exp[code]=!g._exp[code]; render(); }
function toggleBenExtra(i){ const g=grp(i); g._extra=!g._extra; render(); }
function renderBenefitTable(g,i){
  const f = groupFee(g);
  const p = presetById(g.preset);
  const payOpts = v => `<option value="" ${v?'':'selected'}>—</option>` + PAY_METHODS.map(m=>`<option value="${m.code}" ${m.code===v?'selected':''}>${m.code} - ${m.name}</option>`).join('');
  const exp = g._exp||{};
  let n=0;
  const rowTr = (r,ri,lvl,caret)=>{
    const c=cbItem(r.code), s=stdRow(g,r);
    const ch = k => s && s[k]!==r[k] ? 'ch' : '';
    const outAge = r.to<g.ageFrom || r.from>g.ageTo;
    return `<tr class="${s?'':'added'} ${outAge?'muted':''} ${lvl?'bt-child':''}">
      <td class="idx">${++n}</td>
      <td><div class="bt-tree" style="padding-left:${lvl*24}px;">${lvl?'<span class="bt-elbow">└</span>':''}${caret}<div class="bt-pick" onclick="openCodebook(${i},${ri})" title="${r.code} - ${c.name} · bấm để đổi"><span class="cb-code">${r.code}</span><span class="nm">${c.name}</span></div></div></td>
      <td><input class="bt-in num ${ch('si')}" inputmode="numeric" value="${numFmt(r.si)}" onchange="setRow(${i},${ri},'si',this.value)"></td>
      <td><select class="bt-in ${ch('pay')}" title="${(PAY_METHODS.find(m=>m.code===r.pay)||{name:''}).name}" onchange="setRow(${i},${ri},'pay',this.value)">${payOpts(r.pay)}</select>
        <select class="bt-in geo ${s && (s.geo||'')!==(r.geo||'') ? 'ch' : ''}" title="Phạm vi địa lý của quyền lợi" onchange="setRow(${i},${ri},'geo',this.value)"><option value="">Theo nhóm</option>${GEO_SCOPES.map(x=>`<option value="${x.id}" ${x.id===r.geo?'selected':''}>${x.label} ×${x.factor}</option>`).join('')}</select></td>
      <td><input class="bt-in num ${ch('rate')}" inputmode="decimal" value="${r.rate}" onchange="setRow(${i},${ri},'rate',this.value)"><div class="fee">${r.rate && r.si ? fmt(Math.round(rowFee(r,g.geo))) : 'hạn mức con'}</div></td>
      <td class="act"><span class="bt-ic" title="Nhân bản dòng" onclick="dupRow(${i},${ri})">${IC_COPY}</span><span class="bt-ic del" title="Xóa dòng" onclick="delRow(${i},${ri})">${IC_TRASH}</span></td>
    </tr>`;
  };
  // dạng cây theo mã codebook: mỗi cấp thụt vào một nấc, cấp nào có mục con thì mở / thu riêng
  const present = [...new Set(g.rows.map(r=>r.code))];
  const parentOf = code => { const seg=code.split('.'); for(let k=seg.length-1;k>1;k--){ const p=seg.slice(0,k).join('.'); if(present.includes(p)) return p; } return null; };
  const kidsOf = code => present.filter(c=>parentOf(c)===code);
  const node = (code, lvl) => {
    const kids = kidsOf(code), open = !!exp[code];
    const caret = kids.length
      ? `<span class="bt-car" title="${open?'Thu gọn':'Mở'} mục con" onclick="toggleBenTop(${i},'${code}')">${open?'▾':'▸'}</span>`
      : `<span class="bt-car leaf"></span>`;
    const own = g.rows.map((r,ri)=>({r,ri})).filter(x=>x.r.code===code);
    return own.map((x,k)=>rowTr(x.r,x.ri,lvl,k===0?caret:'<span class="bt-car leaf"></span>')).join('')
      + (open ? kids.map(c=>node(c,lvl+1)).join('') : '');
  };
  const tops = present.filter(c=>!parentOf(c));
  const topBlock = top => node(top,0);
  const mainTops = tops.filter(t=>MAIN_BEN.includes(benTop(t))), extraTops = tops.filter(t=>!MAIN_BEN.includes(benTop(t)));
  const sec = (label, click, open) => `<tr class="bt-sec" ${click?`onclick="${click}"`:''}><td colspan="6">${click?(open?'▾ ':'▸ '):''}${label}</td></tr>`;
  const trs = !g.rows.length ? '' :
      sec('Quyền lợi chính') + mainTops.map(topBlock).join('')
    + (extraTops.length ? sec('Quyền lợi bổ sung', `toggleBenExtra(${i})`, g._extra) + (g._extra ? extraTops.map(topBlock).join('') : '') : '');
  return `
  <div class="ben-acc">
    <div class="ba-hd">
      <span>Quyền lợi bảo hiểm</span>
      <button class="btn btn-outline btn-sm" onclick="openCodebook(${i})">＋ Thêm quyền lợi</button>
    </div>
    <div class="bt-wrap"><table class="bt">
      <colgroup><col style="width:26px"><col><col style="width:116px"><col style="width:132px"><col style="width:84px"><col style="width:62px"></colgroup>
      <thead><tr><th>#</th><th>Quyền lợi</th><th class="num" title="Số tiền bảo hiểm (VND/người/năm)">STBH (VND)</th><th title="Hình thức chi trả · Phạm vi địa lý của quyền lợi">Chi trả · Phạm vi</th><th class="num" title="Tỷ lệ phí (%) và phí cơ sở/người của dòng">Tỷ lệ phí %</th><th></th></tr></thead>
      <tbody>${trs || `<tr><td colspan="6" class="empty">Chưa có quyền lợi — bấm “＋ Thêm quyền lợi” để chọn từ PPM.</td></tr>`}</tbody>
    </table></div>
    <div class="bt-sum">
      ${groupDiffs(g).length ? `<span class="g-link" onclick="resetGroup(${i})">↺ Khôi phục theo gói chuẩn</span>` : ''}
      <span class="sp"></span>
      <span title="Phí cơ sở đã nhân hệ số phạm vi của từng dòng">Phí cơ sở <b>${fmt(Math.round(f.raw))}</b> (phạm vi nhóm: ${geoById(g.geo).label}) = <b class="pp">${fmt(f.perPerson)}/người</b></span>
    </div>
  </div>`;
}

function extToggle(k, el){
  const m=S.chaophi.extModal;
  m.sel = m.sel.includes(k) ? m.sel.filter(x=>x!==k) : m.sel.concat(k);
  el.classList.toggle('on', m.sel.includes(k));
  el.querySelector('input').checked = m.sel.includes(k);
  document.getElementById('extCount').textContent = m.sel.length;
  document.getElementById('extAdd').disabled = !m.sel.length;
}
function extApply(){ const t=S.chaophi.current.terms; S.chaophi.extModal.sel.forEach(k=>{ t.ext[k]=true; }); S.chaophi.extModal=null; render(); }
function renderExtModal(){
  const t=S.chaophi.current.terms, m=S.chaophi.extModal;
  const list = EXT_CLAUSES.map(c=>{

    return `<div class="cb-item ${on?'on':''}" style="${has?'opacity:.55;cursor:default;':''}" data-s="${normVN(c.code+' '+c.label)}" ${has?'':`onclick="extToggle('${c.k}',this)"`}>

    <div class="cb-list">

function renderQuoteTemplateDocument(q, opts){

  const termLabel = (q.termMonths==24?'24 tháng':'12 tháng');

  const rowsHTML = (q.groups||[]).map(g => {
    const p = presetById(g.preset);
    const f = groupFee(g);
    return `<tr>
      <td style="padding:12px 14px;border-bottom:1px solid #eef1f8;"><b>${g.name}</b>${g.title?`<div class="tiny-note" style="margin:2px 0 0;">${g.title}</div>`:''}</td>
      <td style="padding:12px 14px;border-bottom:1px solid #eef1f8;text-align:center;">${g.count}</td>

  const levelsRange = (q.groups||[]).length ? [...new Set(q.groups.map(g=>presetById(g.preset).name))].join(', ') : '—';
  // Bảng quyền lợi so sánh giữa các nhóm khách hàng — dựng động từ các dòng quyền lợi
  const G = q.groups||[];
  const codes = [...new Set(G.flatMap(g=>g.rows.map(r=>r.code)))].sort((a,b)=>cbOrder(a)-cbOrder(b));
  const cellOf = (g, code) => {

  };

      <tbody>${benBody}</tbody>
    </table>` : '';

      <div><span style="color:var(--ink-soft);">Thời gian chờ:</span> Tai nạn: ${t.waitAcc} · Bệnh thông thường: ${t.waitIll} · Bệnh đặc biệt/có sẵn: ${t.waitSpecial} · Thai sản: ${t.waitMa}</div>
      ${extList.length ? `<div style="color:var(--ink-soft);margin-top:4px;">Điều khoản mở rộng:</div><ul style="margin:4px 0 0;padding-left:20px;">${extList.map(x=>`<li>${x}</li>`).join('')}</ul>` : ''}
    </div>` : '';
  return `
  <div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 32px;font-size:12.8px;color:var(--ink);">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:2px solid var(--bg-3);">
      <div>
        <div style="font-size:26px;font-weight:900;color:var(--bg-3);line-height:1;">PTI Care</div>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">Tổng Công ty Cổ phần Bảo hiểm Bưu điện (PTI)</div>
      </div>
      <div style="text-align:right;font-size:11.5px;color:var(--ink-soft);line-height:1.7;">
        <div style="font-weight:800;color:var(--ink);">BẢN CHÀO PHÍ BẢO HIỂM</div>

        <div>Ngày lập: <b style="color:var(--ink);">${new Date().toLocaleDateString('vi-VN')}</b></div>
      </div>
    </div>

    <div style="text-align:center;font-size:15px;font-weight:800;margin:22px 0 20px;letter-spacing:.01em;">
      BẢNG CHÀO PHÍ BẢO HIỂM SỨC KHỎE NHÓM — PTI CARE (EB)
    </div>

    <div style="display:grid;grid-template-columns:180px 1fr;row-gap:8px;column-gap:16px;margin-bottom:22px;">
      <div style="color:var(--ink-soft);">Doanh nghiệp mua bảo hiểm</div><div><b>${q.company||'—'}</b></div>
      <div style="color:var(--ink-soft);">Mã số thuế</div><div><b>${q.mst||'—'}</b></div>
      <div style="color:var(--ink-soft);">Mã khách hàng (iPTI ID)</div><div><b>${q.khid||'—'}</b></div>
      <div style="color:var(--ink-soft);">Người liên hệ</div><div><b>${q._contact||'—'}${q._position?` — ${q._position}`:''}</b></div>
      <div style="color:var(--ink-soft);">Thời hạn bảo hiểm</div><div><b>${termLabel} (${fromTo})</b></div>
      ${q.plans && q.plans.length>1 ? `<div style="color:var(--ink-soft);">Phương án chào phí</div><div><b>${q.plans[q.planIdx].name}</b> <span style="color:var(--ink-faint);">(trong ${q.plans.length} phương án đã so sánh)</span></div>` : ''}
      <div style="color:var(--ink-soft);">Tổng số người được bảo hiểm</div><div><b>${q.groups?.reduce((s,g)=>s+Number(g.count||0),0)||q.employees||'—'}</b> (${(q.groups||[]).length} nhóm khách hàng)</div>
    </div>

    ${benTable}

    <div style="font-weight:800;margin:4px 0 10px;">II. PHÍ BẢO HIỂM</div>
    <table style="width:100%;border-collapse:collapse;font-size:12.8px;margin-bottom:20px;border:1px solid #eef1f8;border-radius:10px;overflow:hidden;">

          <th style="padding:12px 14px;text-align:center;font-weight:700;color:var(--ink-soft);border-bottom:1px solid #eef1f8;">Số người</th>
          <th style="padding:12px 14px;text-align:left;font-weight:700;color:var(--ink-soft);border-bottom:1px solid #eef1f8;">Gói quyền lợi</th>
          <th style="padding:12px 14px;text-align:right;font-weight:700;color:var(--ink-soft);border-bottom:1px solid #eef1f8;">Phí/người</th>

        </tr>
      </thead>
      <tbody>${rowsHTML || `<tr><td colspan="5" style="padding:16px;text-align:center;color:var(--ink-soft);">Chưa có phân bổ nhóm</td></tr>`}</tbody>

        <div style="display:flex;justify-content:space-between;padding:12px 0 4px;font-size:15px;"><span style="font-weight:800;">TỔNG THANH TOÁN</span><b style="color:var(--bg-3);font-size:17px;">${fmt(clientPay)}</b></div>

function findPolicy(id){ return S.capdon.policies.find(p=>p.id===id); }
function startCapdon(id){
  const p=findPolicy(id); p.status='dang_cap'; p.step=1;
  const emps=[];
  const docs={};
  for(let i=0;i<p.employees;i++){
    const needsSupplement = p.needsHealthSupplement===false ? false : (i===2 || i===5);
    const base = 3500000;
    const empId = ('00109000'+(1000+i)).slice(-9);
    emps.push({
      name:NAME_POOL[i%NAME_POOL.length],
      id:empId,
      gender: i%2? 'Nữ':'Nam',
      quoteFee: base,
      actualFee: needsSupplement ? base+300000 : base,
      health: needsSupplement ? 'bosung' : 'dat'
    });
    if(needsSupplement){ docs[empId] = { khaisk:false, ketqua:false, cccd:false, chungtu:false }; }
  }
  p._employees=emps;
  p._docs=docs;
  p._staffUploaded=false;
  p._invoice = {name:p.company, mst:p.mst, address:'', email:''};
  S.capdon.paymentMethod='qr';
  S.capdon.copied=false;

function renderStepperCapdon(step){
  const items=[ {label:'Hoàn thiện hồ sơ và tính phí', icon:'<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="13" r="1.3" fill="#2f6bff"/></svg>'}, {label:'Xác nhận thông tin', icon:'<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M8 12.3l2.6 2.6L16.5 9" stroke="#2f6bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'}, {label:'Tải giấy tờ thẩm định', icon:'<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 3h12v18l-2-1.3L14 21l-2-1.3L10 21l-2-1.3L6 21V3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 8h7M8.5 11.5h7M8.5 15h4" stroke="#2f6bff" stroke-width="1.5" stroke-linecap="round"/></svg>'}, {label:'Thanh toán', icon:'<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.7"/><rect x="6" y="14" width="5" height="2" rx="0.5" fill="#2f6bff"/></svg>'} ];
  let html=`<div class="stepper">`;
  items.forEach((it,idx)=>{
    const i=idx+1;
    const st=i<step?'done':(i===step?'active':'');
    html += `<div class="step-dot ${st}">${i<step?'<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12.5l4.5 4.5L19 7" stroke="#2f6bff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>':it.icon}</div>`;

  });

  return html;
}

/* ======================= QUẢN LÝ HỒ SƠ — 2 VIEW (Người bán / Quản trị) ======================= */
// Quan hệ: KH.sellerId = người bán mang về · NB.managerId = tuyến trên (người giới thiệu) · NB.workOrgId = thuộc kênh chuyên thu của đại lý tổ chức
// Cán bộ careby của KH = CBKD gần nhất khi đi ngược chuỗi người bán → tuyến trên · nhiều hồ sơ cùng subjectId = 1 ID chủ thể
const SELLER_TYPES = ['sales_officer','collaborator','agent_individual','agent_org'];
const NB_TYPE = {sales_officer:{short:'CBKD', cls:'blue'}, collaborator:{short:'CTV', cls:'green'}, agent_individual:{short:'ĐL cá nhân', cls:'purple'}, agent_org:{short:'ĐL tổ chức', cls:'orange'}};
// Hệ thống PTI mà mỗi loại hồ sơ đăng nhập
const PROFILE_SYS = {sales_officer:'Hệ thống bán hàng', collaborator:'Hệ thống bán hàng', agent_individual:'iCA', agent_org:'iCA', individual:'App myPTI', household:'App myPTI', business:'Portal Doanh nghiệp', nonbusiness:'Portal Doanh nghiệp'};
function isSeller(o){ return SELLER_TYPES.includes(o.custType); }
function nbAll(){ return opOrgs().filter(isSeller); }
function khRoots(){ return opOrgs().filter(o=>!isSeller(o) && !o.parentId); }
function nbDown(id){ return nbAll().filter(o=>o.managerId===id); }
function nbKh(id){ return khRoots().filter(o=>o.sellerId===id); }
function nbKhDeep(id){ return [...nbKh(id), ...nbDown(id).flatMap(c=>nbKhDeep(c.id))]; }
// chuỗi tuyến trên, từ gốc → tuyến trên trực tiếp; dừng tại stopId (có bao gồm stopId)
function nbUpChain(id, stopId){
  const out=[]; let cur=opFind(id), guard=0;
  while(cur && cur.id!==stopId && cur.managerId && guard++<50){ cur=opFind(cur.managerId); if(!cur) break; out.unshift(cur); }
  return out;
}
function nbTier(id, baseId){ return nbUpChain(id, baseId).length; }
function inMyNet(id){ return id===S.me || nbUpChain(id, S.me).some(x=>x.id===S.me); }
function careBy(kh){
  const s=opFind(kh.sellerId); if(!s) return null;
  if(s.custType==='sales_officer') return s;
  return nbUpChain(s.id).reverse().find(x=>x.custType==='sales_officer') || null;
}
function nbStats(id){
  let sellers=0, kh=nbKh(id).length, depth=0;
  nbDown(id).forEach(c=>{ const s=nbStats(c.id); sellers+=1+s.sellers; kh+=s.kh; depth=Math.max(depth,1+s.depth); });
  return {sellers, kh, depth};
}
// Cùng ID chủ thể: hồ sơ khác của cùng một người (KH ⇄ người bán)
function subjTwins(o){ return o.subjectId ? opOrgs().filter(x=>x.id!==o.id && x.subjectId===o.subjectId) : []; }
function twinSellers(o){ return subjTwins(o).filter(isSeller); }
function twinKh(o){ return subjTwins(o).filter(x=>!isSeller(x) && !x.parentId); }
function selfSale(kh){ const s=opFind(kh.sellerId); return !!(s && kh.subjectId && s.subjectId===kh.subjectId); }
// thứ tự cố định: KH → CBKD → CTV → ĐL cá nhân → ĐL tổ chức
function twinRank(x){ return isSeller(x) ? 1+SELLER_TYPES.indexOf(x.custType) : 0; }
function twinShown(o){ return subjTwins(o).filter(x=>isSeller(x) || !x.parentId).sort((a,b)=>twinRank(a)-twinRank(b)); }
function twinRole(x){ return isSeller(x) ? NB_TYPE[x.custType].short : 'Khách hàng'; }
// 2 chiều: vai trò người bán → Mạng lưới (tô sáng nút) · vai trò KH → danh sách Khách hàng (tô sáng dòng)
function twinAct(x){ return isSeller(x) ? `netGoTo('${x.id}')` : `khGoTo('${x.id}')`; }
// Vai trò khác cùng ID chủ thể — dạng chữ "Cũng là …", bấm để nhảy tới đúng hồ sơ
function twinAlso(o){
  const tw=twinShown(o); if(!tw.length) return '';
  return `Cũng là ${tw.map(x=>`<a class="twin-a" title="${x.id}" onclick="event.stopPropagation();${twinAct(x)}">${twinRole(x)}</a>${isSeller(x)&&sellerStatus(x)==='pending'?' (chờ duyệt)':''}`).join(', ')}`;
}
function khGoTo(id){
  S.tab='kh'; S.orgPortal.screen='tree';
  Object.assign(S.kh, {type:'all', src:'all', cb:'all', q:'', group:false, twin:false, hl:id});

function sellerStatus(o){ const p=(o.programs||[])[0]; return p ? p.status : 'active'; }
function nbStatusChip(o){ const s=sellerStatus(o); return s==='pending' ? '<span class="status-pill status-cho">Chờ duyệt</span>' : s==='rejected' ? '<span class="status-pill status-tuchoi">Từ chối</span>' : ''; }
function initials(name){ const p=String(name).trim().split(/\s+/); return (p.length>1 ? p[p.length-2][0]+p[p.length-1][0] : p[0].slice(0,2)).toUpperCase(); }
function khIcon(o){ return leafOfOrg(o).entity==='canhan' ? '👤' : '🏢'; }

  return `<div class="me-mask" onclick="meToggle()"></div>
    <div class="me-pop" style="position:fixed;left:262px;top:auto;bottom:64px;right:auto;">
      <div class="me-hd"><div class="net-av t-sales_officer">${initials(me.name)}</div><div><b>${me.name}</b><div class="tiny-note" style="margin:0;">🪪 ${me.subjectId}</div></div></div>
      ${ps.map(p=>{ const l=leafOfOrg(p), ok=sellerStatus(p)==='active'; return `
      <div class="me-row" onclick="S.net.meOpen=false;openOrgDetail('${p.id}')">
        <span class="me-ic">${l.role==='nb'?'🤝':'🛡️'}</span>
        <div style="flex:1;min-width:0;"><b>${l.label}</b><div class="tiny-note" style="margin:0;">${p.id}</div></div>
        <div style="text-align:right;"><span class="sys-chip">${PROFILE_SYS[p.custType]}</span><div class="tiny-note" style="margin:3px 0 0;" title="Tài khoản đăng nhập">👤 ${p.account||p.phone}</div></div>
        <span class="sdot ${ok?'ok':'wait'}" title="${ok?'Đang hiệu lực':'Chờ hoàn tất'}"></span>
      </div>`; }).join('')}

/* ---------- Quản lý hồ sơ khách hàng ---------- */
const KH_TYPES = [['all','Tất cả'],['individual','👤 Cá nhân'],['business','🏢 Doanh nghiệp'],['nonbusiness','Phi DN'],['household','Hộ KD']];
function khSet(k,v){ S.kh[k]=v; S.kh.hl=null; render(); }
function khSearch(v){ S.kh.q=v; render(); keepFocus('kh-q'); }
function khIdLine(o){ return o.custType==='individual' ? `CCCD ${o.idNo||'—'}` : o.custType==='nonbusiness' ? (o.orgCode||o.orgKind||'—') : `MST ${o.mst}`; }
// Nguồn mang về so với cán bộ careby: chính CBKD bán → Trực tiếp; còn lại → người bán tuyến dưới + tầng
function khSrcCell(kh){
  const s=opFind(kh.sellerId), cb=careBy(kh);
  if(!s) return '—';
  if(selfSale(kh)) return `<span class="src-chip self" title="Người bán và khách hàng là cùng một người">Tự bán</span>${cb && s.id===cb.id ? '' : `<div class="tiny-note">${NB_TYPE[s.custType].short}</div>`}`;
  if(cb && s.id===cb.id) return '<span class="src-chip direct">Trực tiếp</span>';
  return `<b>${s.name}</b><div class="tiny-note">${NB_TYPE[s.custType].short}${cb?` · F${nbTier(s.id, cb.id)}`:''}</div>`;
}
function khRow(o, isAdmin){
  const leaf=leafOfOrg(o), cb=careBy(o), kids=opChildren(o.id).length;
  const active=(o.programs||[]).some(p=>p.status==='active');
  const mine=!isAdmin && o.subjectId===opFind(S.me).subjectId;
  return `<tr style="cursor:pointer;" id="khr-${o.id}" class="${S.kh.hl===o.id?'row-hl':''}" onclick="openOrgDetail('${o.id}')">
    <td><div style="font-weight:800;">${khIcon(o)} ${o.name}${mine?' <span class="chip blue">Tôi</span>':''}</div><div class="tiny-note">${o.id} · ${khIdLine(o)} · ${leaf.short}${kids?` · <b style="color:var(--bg-3);" title="Đơn vị trực thuộc">🌿 ${kids}</b>`:''}</div></td>
    ${isAdmin
      ? `<td><span class="sid">${o.subjectId}</span><div class="tiny-note">${twinAlso(o)}</div></td>
         <td>${cb?`<b>${cb.name}</b><div class="tiny-note">${cb.unit}</div>`:'—'}</td>`
      : `<td>${o.phone||'—'}<div class="tiny-note">${o.email||''}</div></td>`}
    <td>${khSrcCell(o)}</td>
    <td style="text-align:center;">${active?'<span class="status-pill status-done">Hiệu lực</span>':'<span class="status-pill status-cho">Chờ</span>'}</td>
  </tr>`;
}
function renderKhMgmt(){
  const isAdmin=S.view==='admin', f=S.kh, q=normVN(f.q);
  const scope = isAdmin ? khRoots() : khRoots().filter(o=>{ const cb=careBy(o); return cb && cb.id===S.me; });
  const nInd = scope.filter(o=>leafOfOrg(o).entity==='canhan').length, nOrg = scope.length-nInd;
  const cbs = nbAll().filter(o=>o.custType==='sales_officer');
  let rows = scope.filter(o=>f.type==='all' || o.custType===f.type)
    .filter(o=>!q || [o.name,o.id,o.subjectId,o.mst,o.idNo,o.contact].some(x=>normVN(x).includes(q)));
  if(!isAdmin && f.src!=='all') rows = rows.filter(o=>(o.sellerId===S.me) === (f.src==='direct'));
  if(isAdmin && f.cb!=='all') rows = rows.filter(o=>{ const cb=careBy(o); return f.cb==='none' ? !cb : cb && cb.id===f.cb; });
  const nTwin = scope.filter(o=>twinSellers(o).length).length;
  if(isAdmin && f.twin) rows = rows.filter(o=>twinSellers(o).length);
  const typePills = KH_TYPES.map(([k,l])=>`<div class="fpill ${f.type===k?'active':''}" onclick="khSet('type','${k}')">${l} · ${k==='all'?scope.length:scope.filter(o=>o.custType===k).length}</div>`).join('');
  let body;
  if(isAdmin && f.group){
    const groups = [...cbs.map(c=>({cb:c, list:rows.filter(o=>{ const x=careBy(o); return x && x.id===c.id; })})), {cb:null, list:rows.filter(o=>!careBy(o))}].filter(g=>g.list.length);
    body = groups.map(g=>`<tr class="grp-row"><td colspan="5">${g.cb ? `🧑‍💼 ${g.cb.name} · ${g.cb.unit}` : 'Chưa có careby'} <span class="nst">🛡️ ${g.list.length}</span></td></tr>${g.list.map(o=>khRow(o,true)).join('')}`).join('');
  } else body = rows.map(o=>khRow(o,isAdmin)).join('');
  const kpis = isAdmin
    ? kpi('🛡️','Khách hàng',scope.length) + kpi('👤','Cá nhân',nInd) + kpi('🏢','Tổ chức',nOrg) + kpi('🧑‍💼','Cán bộ careby',cbs.length)
    : kpi('🛡️','Tôi careby',scope.length) + kpi('👤','Cá nhân',nInd) + kpi('🏢','Tổ chức',nOrg) + kpi('🌐','Qua mạng lưới',scope.filter(o=>o.sellerId!==S.me).length,'','',"khSet('src','net')");
  const srcTabs = [['all','Tất cả'],['direct','Trực tiếp'],['net','Qua CTV']].map(([k,l])=>`<div class="seg-tab ${f.src===k?'active':''}" onclick="khSet('src','${k}')">${l}</div>`).join('');
  return `
  <div class="page-title"><span class="ico">${icon_building()}</span> ${isAdmin?'Khách hàng':'Khách hàng của tôi'}</div>
  <div class="kpi-row">${kpis}</div>
  <div class="card">
    <div class="mg-tools">
      <div class="filter-pills">${typePills}</div>
      <span class="sp"></span>
      ${isAdmin
        ? `<select class="input" onchange="khSet('cb',this.value)"><option value="all">Tất cả careby</option>${cbs.map(c=>`<option value="${c.id}" ${f.cb===c.id?'selected':''}>${c.name}</option>`).join('')}<option value="none" ${f.cb==='none'?'selected':''}>Chưa có careby</option></select>
           ${nTwin?`<div class="fpill ${f.twin?'active':''}" title="Cùng ID chủ thể có hồ sơ người bán" onclick="khSet('twin',${!f.twin})">Kiêm người bán · ${nTwin}</div>`:''}
           <div class="fpill ${f.group?'active':''}" title="Nhóm theo cán bộ careby" onclick="khSet('group',${!f.group})">▤ Nhóm</div>`
        : `<div class="seg-tabs sm">${srcTabs}</div>`}
    </div>
    <div class="mg-tools">
      <input id="kh-q" class="search-box" style="padding-left:14px;width:280px;" placeholder="${isAdmin?'Tên, mã KH, ID chủ thể, MST/CCCD…':'Tên, ID, MST/CCCD…'}" value="${f.q}" oninput="khSearch(this.value)">
      <span class="sp"></span>
      ${isAdmin?`<span class="icon-btn" title="Tra cứu theo loại hồ sơ" onclick="openByType()">🗂️</span>`:''}
      <button class="btn btn-primary btn-sm" onclick="openMoidForm()">${icon_plus()} Mở hồ sơ</button>
    </div>
    <table class="pti">
      <thead><tr><th>Khách hàng</th>${isAdmin?'<th>ID chủ thể</th><th>Careby</th>':'<th>Liên hệ</th>'}<th>${isAdmin?'Người bán':'Nguồn'}</th><th style="text-align:center;">Chương trình</th></tr></thead>
      <tbody>${body || `<tr><td colspan="${isAdmin?5:4}"><div class="empty-state">Không có dữ liệu</div></td></tr>`}</tbody>
    </table>
  </div>`;
}

/* ---------- Mạng lưới người bán: cây đa tầng (không giới hạn cấp) ---------- */
// Tối giản cho nhiều tầng: mở đến tầng Fn · mở/đóng từng nhánh · ⤢ xem riêng một nhánh (breadcrumb quay lại) · KH dạng chip
const netKids = o=>nbDown(o.id);
function netIsOpen(id, tier){ const v=S.net.open[id]; return v!==undefined ? v : tier < S.net.depth; }
function netToggle(id, tier){ S.net.open[id] = !netIsOpen(id, tier); render(); }
function netSetDepth(d){ S.net.depth=d; S.net.open={}; render(); }
function netFocus(id){ S.net.focus=id; S.net.open={}; S.net.hl=null; render(); }
function netSet(k,v){ S.net[k]=v; render(); }
function netSearch(v){ S.net.q=v; render(); keepFocus('net-q'); }
function netSelfHit(o,q){ return [o.name,o.id,o.subjectId,o.phone].some(x=>normVN(x).includes(q)); }
function netKhHit(k,q){ return [k.name,k.id].some(x=>normVN(x).includes(q)); }
function netSubHit(o,q,kidsFn){ return netSelfHit(o,q) || nbKh(o.id).some(k=>netKhHit(k,q)) || kidsFn(o).some(c=>netSubHit(c,q,kidsFn)); }
function netDefaultStat(o){
  const st=nbStats(o.id), d=nbDown(o.id).length;
  return `${d?nst('👥',d,'Tuyến dưới trực tiếp'):''}${st.sellers>d?nst('🌐',st.sellers,'Toàn mạng lưới bên dưới'):''}${nst('🛡️',st.kh,'Khách hàng toàn nhánh')}`;
}
function renderNetItem(o, tier, opt){
  const q=normVN(S.net.q), kidsFn=opt.kids;
  let kids=kidsFn(o), khs=(S.net.showKh || q) ? nbKh(o.id) : [];
  if(q){ kids=kids.filter(c=>netSubHit(c,q,kidsFn)); if(!netSelfHit(o,q)) khs=khs.filter(k=>netKhHit(k,q)); else if(!S.net.showKh) khs=[]; }
  // Mạng lưới của chính mình: bỏ dòng gốc "Tôi", F1 thành cấp ngoài cùng, KH tự bán thành hàng chip trên cùng
  if(opt.hideRoot) return `
    ${khs.length ? `<div class="net-kh net-kh-top"><span class="tiny-note" style="margin:0 4px 0 0;">KH trực tiếp</span>${khs.map(k=>`<span class="kh-chip ${q&&netKhHit(k,q)?'hit':''}" onclick="openOrgDetail('${k.id}')">${khIcon(k)} ${k.name}</span>`).join('')}</div>` : ''}
    ${kids.map(c=>renderNetItem(c, tier+1, {...opt, root:false, hideRoot:false, rootLabel:null})).join('') || (khs.length ? '' : '<div class="empty-state" style="padding:28px;">Chưa có tuyến dưới</div>')}`;
  const has = kids.length || khs.length;
  const open = opt.root || q || netIsOpen(o.id, tier);
  const t=NB_TYPE[o.custType];
  const ch = o.workOrgId && opt.showChannel!==false ? opFind(o.workOrgId) : null;
  const up = opt.showUp && o.managerId ? opFind(o.managerId) : null;
  const canFocus = opt.canFocus!==false && !opt.root && nbDown(o.id).length;
  const tw = S.view==='admin' ? twinAlso(o) : '';
  return `
  <div class="net-item">
    <div class="net-node ${opt.root?'root':''} ${(q&&netSelfHit(o,q)) || S.net.hl===o.id?'hit':''}">
      ${has && !opt.root ? `<span class="net-car" onclick="netToggle('${o.id}',${tier})">${open?'▾':'▸'}</span>` : `<span class="net-car leaf">${opt.root?'':'•'}</span>`}
      <div class="net-av t-${o.custType}">${initials(o.name)}</div>
      <div class="net-main" title="Mở hồ sơ" onclick="openOrgDetail('${o.id}')">
        <div class="net-name">${opt.rootLabel||o.name} ${tier>0 && opt.tiers!==false?`<span class="tier">F${tier}</span>`:''}<span class="chip ${t.cls}">${t.short}</span>${ch?`<span class="chip gray" title="Chuyên thu: ${ch.fullName}">🏢 ${ch.name}</span>`:''}${nbStatusChip(o)}</div>
        <div class="net-sub">${o.id}${o.custType==='sales_officer'?` · ${o.unit}`:''}${up?` · <span title="Tuyến trên">↑ ${up.name}</span>`:''}${tw?` · ID chủ thể <span class="sid" style="font-size:11px;">${o.subjectId}</span> · ${tw}`:''}</div>
      </div>
      <div class="net-stat">${opt.statFn ? opt.statFn(o) : netDefaultStat(o)}</div>
      <div class="net-acts">${canFocus ? `<span class="bt-ic" title="Xem riêng nhánh" onclick="netFocus('${o.id}')">⤢</span>` : '<span style="width:29px;"></span>'}</div>
    </div>
    ${has && open ? `<div class="net-kids">
      ${khs.length ? `<div class="net-kh">${khs.map(k=>`<span class="kh-chip ${q&&netKhHit(k,q)?'hit':''}" onclick="openOrgDetail('${k.id}')">${khIcon(k)} ${k.name}</span>`).join('')}</div>` : ''}
      ${kids.map(c=>renderNetItem(c, tier+1, {...opt, root:false, rootLabel:null})).join('')}
    </div>` : ''}
  </div>`;
}
function renderTierBar(maxDepth){
  const opts=[...Array(Math.max(maxDepth,1)).keys()].map(i=>i+1);
  return `<div class="tier-bar" title="Mở đến tầng">${opts.map(d=>`<span class="${S.net.depth===d?'on':''}" onclick="netSetDepth(${d})">F${d}</span>`).join('')}<span class="${S.net.depth>=99?'on':''}" onclick="netSetDepth(99)">Tất cả</span></div>`;
}
function renderKhToggle(){ return `<div class="fpill ${S.net.showKh?'active':''}" title="Hiện / ẩn khách hàng" onclick="netSet('showKh',${!S.net.showKh})">🛡️ KH</div>`; }
function renderNetSearch(){ return `<input id="net-q" class="search-box" style="padding-left:14px;width:240px;" placeholder="${S.view==='admin'?'Người bán, khách hàng, ID chủ thể…':'Người bán, khách hàng…'}" value="${S.net.q}" oninput="netSearch(this.value)">`; }
function renderNetCrumb(baseId, baseLabel){
  const f=S.net.focus; if(!f) return '';
  const chain=nbUpChain(f, baseId).filter(x=>x.id!==baseId);
  return `<div class="net-crumb">⤢ <a onclick="netFocus(null)">${baseLabel}</a>${chain.map(x=>` › <a onclick="netFocus('${x.id}')">${x.name}</a>`).join('')} › <b>${opFind(f).name}</b>
    <span style="flex:1;"></span><a title="Xem toàn bộ" onclick="netFocus(null)">✕</a></div>`;
}

function renderNbMgmt(){ return S.view==='admin' ? renderNbAdmin() : renderNbSeller(); }

function renderNbSeller(){
  const me=opFind(S.me), n=S.net, base=me.id;
  const rootId = n.focus && inMyNet(n.focus) ? n.focus : base;
  const st=nbStats(base), khNet=nbKhDeep(base).filter(k=>k.sellerId!==base);
  const tiers={}; (function walk(id,t){ nbDown(id).forEach(c=>{ tiers[t]=(tiers[t]||0)+1; walk(c.id,t+1); }); })(base,1);
  const khNetInd = khNet.filter(k=>leafOfOrg(k).entity==='canhan').length;
  return `
  <div class="page-title"><span class="ico">${icon_building()}</span> Mạng lưới của tôi</div>
  <div class="kpi-row">
    ${kpi('👥','CTV F1', nbDown(base).length)}
    ${kpi('🌐','Toàn mạng lưới', st.sellers, Object.keys(tiers).map(t=>`F${t}: ${tiers[t]}`).join(' · '))}
    ${kpi('🪜','Số tầng', st.depth ? 'F'+st.depth : '—')}
    ${kpi('🛡️','KH qua mạng lưới', khNet.length, `👤 ${khNetInd} · 🏢 ${khNet.length-khNetInd}`)}
  </div>
  <div class="card">
    <div class="mg-tools">
      ${renderTierBar(st.depth)}
      ${renderKhToggle()}
      <span class="sp"></span>
      ${renderNetSearch()}
      <span class="ref-code" title="CTV tự đăng ký và nhập mã này để vào mạng lưới của tôi">Mã giới thiệu <b>${me.id}</b>
        <span class="icon-btn" style="width:28px;height:28px;" title="Sao chép" onclick="navigator.clipboard&&navigator.clipboard.writeText('${me.id}');mgToast('Đã sao chép mã giới thiệu ${me.id}')">${I('copy',14)}</span></span>
    </div>
    ${renderNetCrumb(base, 'Tôi')}
    ${renderNetItem(opFind(rootId), nbTier(rootId, base), {root:true, hideRoot: rootId===base, kids:netKids})}
  </div>`;
}

// View Quản trị: "Mạng lưới người bán" và "Phê duyệt mở hồ sơ" là 2 mục menu riêng (S.net.sub)
function renderNbAdmin(){
  const n=S.net;
  if(n.sub==='appr') return n.task ? renderApprDetail() : `
  <div class="page-title"><span class="ico">${icon_building()}</span> Phê duyệt mở hồ sơ</div>
  ${renderApprList()}`;
  return `
  <div class="page-title"><span class="ico">${icon_building()}</span> Mạng lưới người bán</div>
  ${renderNbAdminNet()}`;
}
function renderNbAdminNet(){
  const n=S.net, all=nbAll(), by=t=>all.filter(o=>o.custType===t).length;
  const pend=apprItems().filter(o=>apprStatus(o)==='pending').length;
  const maxDepth=Math.max(0,...all.filter(o=>!o.managerId).map(r=>nbStats(r.id).depth));
  let tree='';
  if(n.group==='upline'){
    if(n.focus){
      tree = renderNetCrumb(null, 'Toàn hệ thống') + renderNetItem(opFind(n.focus), nbTier(n.focus), {root:true, kids:netKids, showUp:true});
    } else {
      const roots=all.filter(o=>!o.managerId || !opFind(o.managerId));
      const direct=roots.filter(o=>o.custType==='sales_officer'), other=roots.filter(o=>o.custType!=='sales_officer');
      tree = `<div class="net-sec">🧑‍💼 Trực tiếp</div>${direct.map(r=>renderNetItem(r, 0, {kids:netKids})).join('')}
        ${other.length ? `<div class="net-sec">Chưa có tuyến trên</div>${other.map(r=>renderNetItem(r, 0, {kids:netKids})).join('')}` : ''}`;
    }
  } else {
    const orgs=all.filter(o=>o.custType==='agent_org');
    const outside=all.filter(o=>['collaborator','agent_individual'].includes(o.custType) && !o.workOrgId);
    tree = orgs.map(org=>{
      const members=all.filter(x=>x.workOrgId===org.id);
      return `<div class="net-sec">🏢 Trong chuyên thu · ${org.name}</div>
        ${renderNetItem(org, 0, {root:true, kids:o=>o.id===org.id ? members : [], tiers:false, showUp:true, showChannel:false, canFocus:false,
          statFn:o=>o.id===org.id ? nst('🤝',members.length,'Người bán trong chuyên thu')+nst('🛡️',nbKh(org.id).length,'Khách hàng') : netDefaultStat(o)})}`;
    }).join('') + `<div class="net-sec">Ngoài chuyên thu <span class="nst">${outside.length}</span></div>
      ${outside.map(o=>renderNetItem(o, 0, {kids:()=>[], tiers:false, showUp:true, canFocus:false})).join('')}`;
  }
  return `
  <div class="kpi-row k5">
    ${kpi('🤝','Người bán', all.length)}
    ${kpi('🧑‍💼','Trực tiếp', by('sales_officer'))}
    ${kpi('👤','Gián tiếp cá nhân', by('collaborator')+by('agent_individual'), `${by('collaborator')} CTV · ${by('agent_individual')} ĐL`)}
    ${kpi('🏢','Đại lý tổ chức', by('agent_org'), `${all.filter(o=>o.workOrgId).length} CTV chuyên thu`)}
    ${kpi('⏳','Chờ duyệt', pend, '', pend?'warn':'', "goMenu('admin','nb','appr')")}
  </div>
  <div class="card">
    <div class="mg-tools">
      <div class="seg-tabs sm">
        <div class="seg-tab ${n.group==='upline'?'active':''}" title="Ai giới thiệu ai" onclick="S.net.focus=null;netSet('group','upline')">🔗 Giới thiệu</div>
        <div class="seg-tab ${n.group==='channel'?'active':''}" title="CTV thuộc chuyên thu của đại lý tổ chức nào" onclick="S.net.focus=null;netSet('group','channel')">🏢 Chuyên thu</div>
      </div>
      ${n.group==='upline' ? renderTierBar(maxDepth) : ''}
      ${renderKhToggle()}
      <span class="sp"></span>
      ${renderNetSearch()}
      <span class="icon-btn" title="Tra cứu theo loại hồ sơ" onclick="openByType()">🗂️</span>
      <button class="btn btn-primary btn-sm" onclick="openMoidForm()">${icon_plus()} Mở hồ sơ</button>
    </div>
    ${tree}
  </div>`;
}

/* ---------- MCV: phê duyệt mở hồ sơ người bán (trước khi HĐ hợp tác có hiệu lực) — UI theo OPC Đky iCA ---------- */
const APPR_META = {pending:{l:'Chờ duyệt', cls:'status-cho'}, approved:{l:'Đã duyệt', cls:'status-done'}, rejected:{l:'Từ chối', cls:'status-tuchoi'}};
const APPR_PRIO = {agent_org:'HIGH', agent_individual:'MEDIUM', collaborator:'LOW', sales_officer:'LOW'};
const APPR_PROCS = [['all','Tất cả quy trình'],['collaborator','Mở hồ sơ cộng tác viên'],['agent_individual','Mở hồ sơ đại lý cá nhân'],['agent_org','Mở hồ sơ đại lý tổ chức']];
function apprItems(){ return nbAll().filter(o=>o.req); }
function apprStatus(o){ const s=sellerStatus(o); return s==='active' ? 'approved' : s; }
function apprDue(o){ const d=new Date(o.req.date); d.setDate(d.getDate()+2); return d; }
function apprOpen(id){ Object.assign(S.net, {task:id, dec:{}, rsn:{}}); render(); window.scrollTo(0,0); }
function apprBack(){ S.net.task=null; render(); }
function apprDec(k,v){ S.net.dec[k]=v; render(); if(v==='no') keepFocus('rsn-'+k); }
function apprAllOk(){ apprCheckItems(opFind(S.net.task)).forEach(it=>{ S.net.dec[it.k]='ok'; }); render(); }
// Hạng mục chưa chọn → mặc định Phê duyệt (prototype không chặn thao tác)
function apprFinish(id){
  const o=opFind(id), p=o.programs[0], items=apprCheckItems(o), dec=S.net.dec||{}, rsn=S.net.rsn||{};
  const rej=items.filter(it=>dec[it.k]==='no'), undecided=items.filter(it=>!dec[it.k]).length;
  if(rej.length){ p.status='rejected'; o.req.reason=rej.map(it=>`${it.t}: ${rsn[it.k]||'chưa đạt'}`).join(' · '); }
  else {
    p.status='active'; p.effFrom=new Date().toISOString().slice(0,10); delete o.req.reason;
    if(!p.contractNo || p.contractNo==='—') p.contractNo=o.req.code.replace(/^YC-/,'HĐ-');
  }
  delete p.pendingReason;
  Object.assign(o.req, {by:'Hội đồng quản trị', at:new Date().toLocaleString('vi-VN'), dec:Object.fromEntries(items.map(it=>[it.k, dec[it.k]||'ok'])), rsn:{...rsn}});
  opLogActivity(rej.length ? 'Từ chối mở hồ sơ người bán' : 'Phê duyệt mở hồ sơ người bán', `${o.name} (${o.id})`);
  S.net.task=null; render();
  mgToast(rej.length ? `✕ Đã từ chối ${o.req.code}` : `✓ Đã duyệt ${o.req.code}${undecided?` · ${undecided} hạng mục chưa chọn → Phê duyệt`:''}`);
}
function docSvg(seed){
  const tint=['#eaf2fb','#eef7ee','#fbf1e8','#f1eefb'][seed%4];
  return `<svg viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg"><rect width="280" height="180" fill="${tint}"/><rect x="14" y="14" width="252" height="152" rx="6" fill="#fff" stroke="#d7dce6"/><rect x="30" y="28" width="120" height="9" rx="4" fill="#c3ccdb"/><rect x="30" y="46" width="80" height="7" rx="3" fill="#d6dce7"/><circle cx="220" cy="55" r="26" fill="#dbe6f6" stroke="#c3d2ea"/><rect x="30" y="78" width="180" height="7" rx="3" fill="#e2e7ef"/><rect x="30" y="94" width="200" height="7" rx="3" fill="#e2e7ef"/><rect x="30" y="110" width="150" height="7" rx="3" fill="#e2e7ef"/><rect x="30" y="134" width="90" height="20" rx="4" fill="#eef1f6"/></svg>`;
}
function apprCheckItems(o){
  const isOrg=leafOfOrg(o).entity==='tochuc', sv=k=>((o.seller||[]).find(r=>r[0]===k)||[])[1]||'—';
  const up=nbUpChain(o.id), ch=o.workOrgId?opFind(o.workOrgId):null, bank=(o.seller||[]).find(r=>/^Tài khoản/.test(r[0]));
  const items=[{k:'id', t:isOrg?'Giấy chứng nhận đăng ký doanh nghiệp':'Giấy tờ định danh (CCCD)', doc:true,
    rows:isOrg ? [['Tên tổ chức',o.fullName],['Mã số thuế',o.mst],['Người đại diện',o.contact]] : [['Họ tên',o.name],['Số CCCD',o.idNo],['Ngày sinh',fmtDateVN(o.dob)]]}];
  if(o.custType==='agent_individual') items.push({k:'cert', t:'Chứng chỉ đại lý bảo hiểm', doc:true, rows:[['Số chứng chỉ',sv('Số chứng chỉ đại lý')],['Đơn vị cấp',sv('Đơn vị cấp chứng chỉ')],['Ngày hết hạn',sv('Ngày hết hạn chứng chỉ')]]});
  if(o.custType==='agent_org') items.push({k:'cond', t:'Điều kiện đại lý tổ chức', rows:((o.agent||{}).conditions || AGENT_CONDS.map(label=>({label, pass:true}))).map(c=>[c.label, c.pass?'✓ Đạt':'✕ Chưa đạt'])});
  items.push({k:'rel', t:'Quan hệ kênh bán', rows:[['Tuyến trên', up.length?up.map(x=>x.name).join(' › '):'Tự đăng ký'],['Chuyên thu', ch?ch.fullName:'Ngoài chuyên thu']]});
  items.push({k:'bank', t:'Thông tin thụ hưởng', rows:[[bank?bank[0]:'Tài khoản', bank?bank[1]:'—'],['Khu vực / đơn vị', sv('Khu vực hoạt động')!=='—' ? sv('Khu vực hoạt động') : sv('Đơn vị PTI quản lý')]]});
  return items;
}
function apprActIc(ic, tip, onclick, bdg){ return `<span class="act-ic" onclick="event.stopPropagation();${onclick}">${ic}<span class="tip">${tip}</span>${bdg?`<span class="bdg">${bdg}</span>`:''}</span>`; }
function renderApprList(){
  const n=S.net, items=apprItems(), q=normVN(n.apprQ||''), cnt=k=>items.filter(o=>apprStatus(o)===k).length;
  const today=new Date(); today.setHours(0,0,0,0);
  const pills=[['pending','⏳ Chờ duyệt'],['approved','✓ Đã duyệt'],['rejected','✕ Từ chối'],['all','Tất cả']].map(([k,l])=>`<div class="fpill ${n.apprFilter===k?'active':''}" onclick="netSet('apprFilter','${k}')">${l} · ${k==='all'?items.length:cnt(k)}</div>`).join('');
  const rows=items.filter(o=>(n.apprFilter==='all' || apprStatus(o)===n.apprFilter) && (n.apprProc==='all' || o.custType===n.apprProc)
      && (!q || [o.name,o.id,o.req.code,o.idNo,o.mst].some(x=>normVN(x).includes(q))))
    .sort((a,b)=>b.req.date.localeCompare(a.req.date));
  return `
  <div class="card" style="padding:18px 20px;">
    <div class="mg-tools">
      <input id="appr-q" class="search-box" style="padding-left:14px;width:240px;" placeholder="Mã yêu cầu, tên, CCCD…" value="${n.apprQ||''}" oninput="S.net.apprQ=this.value;render();keepFocus('appr-q')">
      <select class="input" onchange="netSet('apprProc',this.value)">${APPR_PROCS.map(([k,l])=>`<option value="${k}" ${n.apprProc===k?'selected':''}>${l}</option>`).join('')}</select>
      <span class="sp"></span>
      <div class="filter-pills">${pills}</div>
    </div>
    <table class="pti">
      <thead><tr><th>ID</th><th>Người bán</th><th>Quy trình</th><th>Ngày tạo</th><th>Hạn xử lý</th><th>Người tạo</th><th>Ưu tiên</th><th style="text-align:center;">Trạng thái</th><th style="text-align:right;">Thao tác</th></tr></thead>
      <tbody>${rows.map(o=>{
        const st=apprStatus(o), due=apprDue(o), late=st==='pending' && due<today, pr=APPR_PRIO[o.custType];
        return `<tr style="cursor:pointer;" onclick="apprOpen('${o.id}')">
          <td style="white-space:nowrap;"><b style="color:var(--bg-3);">${o.req.code}</b></td>
          <td><b>${o.name}</b><div class="tiny-note">${o.id} · ${o.idNo?'CCCD '+o.idNo:'MST '+o.mst}</div></td>
          <td>Mở hồ sơ ${leafOfOrg(o).label.toLowerCase()}</td>
          <td>${fmtDateVN(o.req.date)}</td>
          <td class="${late?'due-late':''}">${due.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})}</td>
          <td>${o.name}</td>
          <td><span class="prio ${pr}">${pr}</span></td>
          <td style="text-align:center;"><span class="status-pill ${APPR_META[st].cls}">${APPR_META[st].l}</span></td>
          <td style="text-align:right;white-space:nowrap;">${apprActIc('📂','Mở',`apprOpen('${o.id}')`)}${apprActIc('💬','Bình luận',`apprCmtOpen('${o.id}')`,(o.comments||[]).length)}</td>
        </tr>`; }).join('') || `<tr><td colspan="9"><div class="empty-state">Không có yêu cầu</div></td></tr>`}</tbody>
    </table>
  </div>`;
}
function renderApprDetail(){
  const o=opFind(S.net.task), leaf=leafOfOrg(o), st=apprStatus(o), ro=st!=='pending', isOrg=leaf.entity==='tochuc';
  const items=apprCheckItems(o), dec=ro ? (o.req.dec||Object.fromEntries(items.map(it=>[it.k,'ok']))) : S.net.dec, rsn=ro ? (o.req.rsn||{}) : S.net.rsn;
  const up=o.managerId?opFind(o.managerId):null, ch=o.workOrgId?opFind(o.workOrgId):null;
  const info=[[isOrg?'Tên tổ chức':'Họ tên', o.fullName], [isOrg?'MST':'CCCD', isOrg?o.mst:o.idNo], ['Điện thoại', o.phone], ['Loại hồ sơ', leaf.label], ['Tuyến trên', up?up.name:'—'], ['Chuyên thu', ch?ch.name:'—']];
  const nOk=items.filter(it=>dec[it.k]==='ok').length, nNo=items.filter(it=>dec[it.k]==='no').length;
  return `
  <div class="req-banner">📄 ${o.req.code} — Mở hồ sơ ${leaf.label.toLowerCase()} · ${o.name} <span class="status-pill ${APPR_META[st].cls}">${APPR_META[st].l}</span></div>
  <span class="back-link" onclick="apprBack()">← Danh sách</span>
  <div class="cust-sticky"><div class="cust">
    <div class="cust-photo net-av t-${o.custType}">${initials(o.name)}</div>
    <div class="cust-info">${info.map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${v||'—'}</div></div>`).join('')}</div>
  </div></div>
  ${st==='rejected' && o.req.reason ? `<div class="notice danger">✕ ${o.req.reason}</div>` : ''}
  ${st==='pending' && (o.programs[0]||{}).pendingReason ? `<div class="notice warn">⏳ ${o.programs[0].pendingReason}</div>` : ''}
  <div class="ck-title">Hạng mục thẩm định <span class="me-n">${items.length}</span></div>
  ${items.map((it,i)=>{ const d=dec[it.k]; return `
  <div class="ck-card ${d||''}">
    <div class="ck-hd"><span class="ck-num">${i+1}</span><b>${it.t}</b></div>
    <div class="ck-bd">${it.doc?`<div class="ck-img">${docSvg(i)}</div>`:''}<div class="ck-meta">${it.rows.map(r=>`<div class="mrow"><span class="k">${r[0]}</span><span class="v">${r[1]||'—'}</span></div>`).join('')}</div></div>
    <div class="ck-dec">${ro
      ? (d==='no' ? `<span class="status-pill status-tuchoi">✕ Từ chối</span> ${rsn[it.k]||''}` : '<span class="status-pill status-done">✓ Phê duyệt</span>')
      : `<label class="radio-opt"><input type="radio" name="dec-${it.k}" ${d==='ok'?'checked':''} onchange="apprDec('${it.k}','ok')"> Phê duyệt</label>
         <label class="radio-opt rej"><input type="radio" name="dec-${it.k}" ${d==='no'?'checked':''} onchange="apprDec('${it.k}','no')"> Từ chối</label>
         ${d==='no'?`<input class="input ck-reason" id="rsn-${it.k}" placeholder="Lý do từ chối…" value="${rsn[it.k]||''}" oninput="S.net.rsn['${it.k}']=this.value">`:''}`}
    </div>
  </div>`; }).join('')}
  ${ro ? '' : `<div class="ck-bar">
    <div><span class="sum-pill ok">✓ ${nOk}</span><span class="sum-pill no">✕ ${nNo}</span><span class="sum-pill wait">⏳ ${items.length-nOk-nNo}</span></div>
    <div style="display:flex;gap:8px;">
      ${apprActIc('💬','Bình luận',`apprCmtOpen('${o.id}')`,(o.comments||[]).length)}
      <button class="btn btn-ghost btn-sm" onclick="apprAllOk()">✓ Duyệt tất cả</button>
      <button class="btn btn-primary btn-sm" onclick="apprFinish('${o.id}')">» Xác nhận</button>
    </div>
  </div>`}`;
}
function apprCmtOpen(id){ S.net.cmt=id; render(); keepFocus('cmt-in'); }
function apprCmtClose(){ S.net.cmt=null; render(); }
function apprCmtSend(){
  const el=document.getElementById('cmt-in'), v=el && el.value.trim(); if(!v) return;
  const o=opFind(S.net.cmt); (o.comments=o.comments||[]).push({who:'Hội đồng quản trị', text:v, at:new Date().toLocaleString('vi-VN')});
  render(); keepFocus('cmt-in');
}
function renderMgmtOverlays(){
  if(S.net.meOpen && S.view==='seller' && !portalRole()) return renderMePop();
  const pr=portalRole(); if(pr && S.portal[pr].otp) return renderPortalOtp();
  if(pr && portalAcc(pr) && S.portal[pr].ob) return renderObModal();
  if(pr && portalAcc(pr) && S.portal[pr].done) return renderObDone();
  if(!S.net.cmt) return '';
  const o=opFind(S.net.cmt), cs=o.comments||[];
  return `<div class="modal-overlay" onclick="if(event.target===this) apprCmtClose()"><div class="modal-box" style="max-width:460px;">
    <span class="modal-close" onclick="apprCmtClose()">✕</span>
    <h3 style="margin:0 0 14px;">💬 ${o.req ? o.req.code : o.id}</h3>
    ${cs.length ? cs.map(c=>`<div class="cmt-item"><div class="tiny-note" style="margin:0 0 3px;">${c.who} · ${c.at}</div>${c.text}</div>`).join('') : '<div class="empty-state" style="padding:24px;">Chưa có bình luận</div>'}
    <div style="display:flex;gap:8px;margin-top:10px;">
      <input id="cmt-in" class="input" style="padding:10px 12px;" placeholder="Nhập bình luận…" onkeydown="if(event.key==='Enter') apprCmtSend()">
      <button class="btn btn-primary btn-sm" onclick="apprCmtSend()">➤</button>
    </div>
  </div></div>`;
}

/* ---------- Thẻ quan hệ trên màn chi tiết hồ sơ ---------- */
function netGoTo(id){
  S.tab='nb'; S.orgPortal.screen='tree'; Object.assign(S.net, {q:'', open:{}, sub:'net', group:'upline', task:null, hl:id});
  S.net.focus = S.view==='seller' ? (inMyNet(id) && id!==S.me ? id : null) : (nbDown(id).length ? id : (opFind(id).managerId || null));
  render();
}
// Dưới tiêu đề hồ sơ chi tiết: ID chủ thể + mọi hồ sơ cùng ID (hồ sơ đang xem tô sáng) — thấy ở mọi tab
function subjStrip(org){
  const all=[org, ...twinShown(org)].sort((a,b)=>twinRank(a)-twinRank(b));
  return `<div class="subj-strip"><span>ID chủ thể <b>${org.subjectId}</b></span>${all.length>1 ? `<span>· ${all.length} hồ sơ:</span>${all.map(p=>{ const cur=p.id===org.id; return `<span class="pchip ${cur?'cur':'go'}" ${cur?'title="Đang xem"':`onclick="openOrgDetail('${p.id}')"`}>${twinRole(p)} · ${p.id}${isSeller(p)&&sellerStatus(p)==='pending'?' <span class="tiny-note" style="margin:0;">chờ duyệt</span>':''}</span>`; }).join('')}` : ''}</div>`;
}
function renderSellerRelCard(org){
  const chain=nbUpChain(org.id), ch=org.workOrgId?opFind(org.workOrgId):null, down=nbDown(org.id), khs=nbKh(org.id), st=nbStats(org.id);

  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;">
      <h3 style="margin:0;">🌐 Mạng lưới</h3>
      <span class="icon-btn" title="Xem trên sơ đồ mạng lưới" onclick="netGoTo('${org.id}')">⤢</span>
    </div>
    <div class="rel-grid">
      <div class="rel-box"><div class="f-label">↑ Tuyến trên</div>${chain.length ? chain.map(link).join(' › ') : '<b>—</b>'}</div>
      <div class="rel-box"><div class="f-label">🏢 ${org.custType==='agent_org'?'Trong chuyên thu':'Chuyên thu'}</div>${org.custType==='agent_org' ? (members.map(link).join(', ')||'—') : ch ? link(ch) : '<b>Ngoài chuyên thu</b>'}</div>
      <div class="rel-box"><div class="f-label">👥 Tuyến dưới ${st.sellers?`<span class="nst">🌐 ${st.sellers}</span>`:''}</div>${down.map(link).join(', ')||'—'}</div>
      <div class="rel-box"><div class="f-label">🛡️ Khách hàng ${st.kh?`<span class="nst">${st.kh}</span>`:''}</div>${khs.map(link).join(', ')||'—'}</div>
    </div>
  </div>`;
}

}

function portalRole(){ return S.tab && S.tab.startsWith('p_') ? S.tab.slice(2) : null; }

function portalAcc(r){ const u=S.portal[r].acc; return u ? S.accounts.find(a=>a.role===r && a.user===u) : null; }
function portalGo(screen){ P().screen=screen; render(); window.scrollTo(0,0); }
function portalVal(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }
function portalLogin(){
  const r=portalRole(), u=portalVal('pt-user');
  let a=S.accounts.find(x=>x.role===r && x.user===u);
  if(a) mgToast('Đăng nhập thành công');
  else { a=S.accounts.find(x=>x.role===r); mgToast('Không tìm thấy tài khoản — vào bằng tài khoản demo'); }
  Object.assign(P(), {acc:a.user, screen:'home', page:'acc'}); render();
}
function portalLogout(){ Object.assign(P(), {acc:null, screen:'login'}); render(); }

function portalRegOtp(){
  P().form = {name:portalVal('rg-name'), phone:portalVal('rg-phone'), email:portalVal('rg-email')};
  if(!P().form.phone) mgToast('Chưa nhập số điện thoại — hệ thống sẽ tự cấp tên đăng nhập');

function orgOrDescendantMatches(id, search){
  const org = opFind(id);
  if(org.name.toLowerCase().includes(search) || org.id.toLowerCase().includes(search) || org.mst.toLowerCase().includes(search)) return true;
  return opChildren(id).some(c=>orgOrDescendantMatches(c.id, search));
}
function opAutoExpandForSearch(search){
  if(!search) return;
  opOrgs().forEach(org=>{
    const selfMatches = org.name.toLowerCase().includes(search) || org.id.toLowerCase().includes(search) || org.mst.toLowerCase().includes(search);
    if(selfMatches){ opAncestors(org.id).forEach(a=>{ S.orgPortal.expanded[a.id]=true; }); }
  });
}
function orgPassesFilters(org){
  if(S.orgPortal.filterRole!=='all' && !org.roles.includes(S.orgPortal.filterRole)) return false;
  if(S.orgPortal.filterLevel!=='all' && String(org.level)!==S.orgPortal.filterLevel) return false;
  return true;
}
function orgOrDescendantPassesFilters(id){
  const org = opFind(id);
  if(orgPassesFilters(org)) return true;
  return opChildren(id).some(c=>orgOrDescendantPassesFilters(c.id));
}

  business:{ title:'Cơ cấu tổ chức doanh nghiệp', sub:'Mỗi dòng đại diện cho một pháp nhân hoặc đơn vị trực thuộc (một Mã định danh Org ID duy nhất). Bấm ▸ để mở nhánh, bấm vào dòng để xem hồ sơ chi tiết & nhân sự riêng.' },
  nonbusiness:{ title:'Danh sách khách hàng phi doanh nghiệp', sub:'Các tổ chức không có đăng ký kinh doanh (đơn vị sự nghiệp, tổ chức xã hội…). Bấm vào dòng để xem hồ sơ chi tiết & nhân sự.', c1:'Tổ chức', c2:'Loại hình', c3:'Liên hệ', c4:'Chương trình', search:'Tìm theo tên tổ chức…' },
  agent_individual:{ title:'Danh sách đại lý cá nhân', sub:'Cá nhân có chứng chỉ đại lý và hợp đồng đại lý với PTI. Bấm vào dòng để xem hồ sơ người bán.', c1:'Đại lý cá nhân', c2:'Chứng chỉ đại lý', c3:'Liên hệ', c4:'Hợp đồng đại lý', search:'Tìm theo tên, mã đại lý, số chứng chỉ…' },
  collaborator:{ title:'Danh sách cộng tác viên', sub:'Cộng tác viên giới thiệu khách hàng — mỗi CTV trực thuộc một người quản lý trực tiếp (đại lý hoặc nhân viên PTI).', c1:'Cộng tác viên', c2:'Người quản lý trực tiếp', c3:'Liên hệ', c4:'Thỏa thuận cộng tác', search:'Tìm theo tên, mã CTV…' },
  household:{ title:'Danh sách khách hàng hộ kinh doanh', sub:'Hộ kinh doanh cá thể có Giấy chứng nhận đăng ký hộ kinh doanh.', c1:'Hộ kinh doanh', c2:'Số ĐKKD', c3:'Liên hệ', c4:'Chương trình', search:'Tìm theo tên hộ kinh doanh, số ĐKKD…' },
  sales_officer:{ title:'Danh sách cán bộ kinh doanh', sub:'Nhân sự kinh doanh của PTI — kênh trực tiếp (offline).', c1:'Cán bộ kinh doanh', c2:'Đơn vị · Mã nhân viên', c3:'Liên hệ', c4:'Hợp đồng', search:'Tìm theo tên, mã nhân viên…' },

};
// Danh sách: chọn lần lượt Vai trò → Loại chủ thể → Loại chi tiết, chưa chọn thì không hiện lớp dưới
function opSetRoleTab(r){ S.orgPortal.pick={role:r, entity:null}; S.orgPortal.custTab=null; S.orgPortal.search=''; render(); }
function opSetEntityTab(e){
  const p=S.orgPortal.pick, ls=leavesOf(p.role, e);
  p.entity=e; S.orgPortal.custTab = ls.length===1 ? SUBJECT_LEAVES[ls[0]].custType : null; S.orgPortal.search=''; render();
}

function renderOrgTree(){
  const search = (S.orgPortal.search||'').toLowerCase();
  opAutoExpandForSearch(search);

  function rowsFor(id, depth, guideStack){
    const org = opFind(id);
    if(search && !orgOrDescendantMatches(id, search)) return '';
    if(!orgOrDescendantPassesFilters(id)) return '';
    const kids = opChildren(id);
    const isExpanded = S.orgPortal.expanded[id]!==false;
    let html = renderOrgRow(org, depth, kids.length>0, isExpanded, guideStack);
    if(kids.length>0 && isExpanded){
      kids.forEach((k,i)=>{
        const isLast = i===kids.length-1;
        html += rowsFor(k.id, depth+1, [...guideStack, isLast]);
      });
    }
    return html;
  }
  const roots = opRoots();
  const rootRows = roots.map((r)=>rowsFor(r.id,0,[])).join('');
  const tab = S.orgPortal.custTab;
  const leafKey = tab ? CUSTTYPE_TO_LEAF[tab] : null, leaf = leafKey ? SUBJECT_LEAVES[leafKey] : null;
  const meta = tab ? LIST_META[tab] : null;
  const role = S.tab, {entity} = S.orgPortal.pick;
  const roleLbl = SUBJECT_ROLES[role].label.toLowerCase();

  // Vai trò lấy theo menu → Loại chủ thể → Loại chi tiết: chọn lớp trên mới hiện lớp dưới
  const entityCards = Object.keys(SUBJECT_ENTITIES).map(e=>`
    <div class="seg-card ${entity===e?'selected':''}" style="padding:10px 14px;" onclick="opSetEntityTab('${e}')">
      <div class="seg-ico" style="width:34px;height:34px;font-size:16px;">${SUBJECT_ENTITIES[e].icon}</div>
      <div class="t">${entityLabel(role,e)}</div>
    </div>`).join('');
  const curLeaves = entity ? leavesOf(role,entity) : [];
  const leafPill = k => `<div class="fpill ${leafKey===k?'active':''}" onclick="opSetCustTab('${SUBJECT_LEAVES[k].custType}')">${SUBJECT_LEAVES[k].short}</div>`;
  // Người bán: nhóm theo kênh Trực tiếp / Gián tiếp
  const channels = [...new Set(curLeaves.map(k=>(SUBJECT_LEAVES[k].channel||'').split(' · ')[0]))];
  const subGroups = curLeaves.length<=1 ? '' : `
    <div class="sub-groups" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;">
      <span class="lvl-elbow">›</span>${channels.map(ch=>`${ch?`<span class="tiny-note" style="margin:0;font-weight:700;">${ch}:</span>`:''}${curLeaves.filter(k=>(SUBJECT_LEAVES[k].channel||'').split(' · ')[0]===ch).map(leafPill).join('')}`).join('<span style="width:8px;"></span>')}
    </div>`;

  const header = `
  <div class="page-title" style="margin-bottom:20px;"><span class="ico">${icon_building()}</span> Quản lý hồ sơ ${roleLbl}</div>`;
  if(!tab) return `${header}
  <div class="card">
    <div class="seg-row">${entityCards}</div>
    ${subGroups}
  </div>`;

  if(leaf.dev) return `${header}
  <div class="card">
    <div class="seg-row">${entityCards}</div>
    ${subGroups}
    <div class="empty-state" style="margin-top:22px;padding:40px 16px;text-align:center;">Tính năng đang phát triển</div>
  </div>`;

  let tableHtml;
  if(tab==='business'){
    tableHtml = `
    <div class="toolbar" style="flex-wrap:wrap;gap:10px;">
      <div class="filter-pills">
        <div class="fpill" onclick="opExpandAll(true)">${icon_expand()} Mở rộng tất cả</div>
        <div class="fpill" onclick="opExpandAll(false)">${icon_collapse()} Thu gọn tất cả</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <select class="input" style="width:150px;padding:9px 12px;" onchange="opSetFilterLevel(this.value)">
          <option value="all" ${S.orgPortal.filterLevel==='all'?'selected':''}>Tất cả cấp bậc</option>
          <option value="1" ${S.orgPortal.filterLevel==='1'?'selected':''}>Chỉ Cấp 1</option>
          <option value="2" ${S.orgPortal.filterLevel==='2'?'selected':''}>Chỉ Cấp 2</option>
          <option value="3" ${S.orgPortal.filterLevel==='3'?'selected':''}>Chỉ Cấp 3</option>
        </select>
        <input class="search-box" style="padding-left:14px;width:260px;" placeholder="Tìm theo tên hoặc MST..." oninput="opSetSearch(this.value)" value="${S.orgPortal.search||''}">
      </div>
    </div>
    <table class="pti tree-table">
      <thead><tr><th>Pháp nhân / Đơn vị trực thuộc</th><th>Cấp bậc</th><th style="text-align:center;">Nhân sự trực thuộc</th><th style="text-align:center;">Đơn vị trực thuộc trực tiếp</th></tr></thead>
      <tbody>${rootRows || `<tr><td colspan="4"><div class="empty-state">Không tìm thấy pháp nhân phù hợp với điều kiện lọc.</div></td></tr>`}</tbody>
    </table>`;
  } else {
    const flatRows = roots
      .filter(o=>{ const s=(S.orgPortal.search||'').toLowerCase(); return !s || o.name.toLowerCase().includes(s) || o.id.toLowerCase().includes(s) || (o.mst||'').toLowerCase().includes(s) || (o.idNo||'').includes(s) || (o.certNo||'').toLowerCase().includes(s); })
      .map(o=>opFlatCustRow(o, tab)).join('');
    tableHtml = `
    <div class="toolbar" style="flex-wrap:wrap;gap:10px;justify-content:flex-end;">
      <input class="search-box" style="padding-left:14px;width:260px;" placeholder="${meta.search}" oninput="opSetSearch(this.value)" value="${S.orgPortal.search||''}">
    </div>
    <table class="pti">
      <thead><tr><th>${meta.c1}</th><th>${meta.c2}</th><th>${meta.c3}</th><th style="text-align:center;">${meta.c4}</th></tr></thead>
      <tbody>${flatRows || `<tr><td colspan="4"><div class="empty-state">Chưa có hồ sơ ${leaf.label.toLowerCase()} nào.</div></td></tr>`}</tbody>
    </table>`;
  }

  return `${header}
  <div class="card">
    <div class="seg-row">${entityCards}</div>
    ${subGroups}
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 16px;">
      <h3 style="margin:0;">${meta.title}</h3>
      <button class="btn btn-primary btn-sm" style="white-space:nowrap;" onclick="openMoidForm('${leafKey}')">${icon_plus()} Mở hồ sơ ${leaf.label.toLowerCase()}</button>
    </div>
    ${tableHtml}
  </div>
  `;
}
function opSetFilterRole(v){ S.orgPortal.filterRole=v; render(); }
function opSetFilterLevel(v){ S.orgPortal.filterLevel=v; render(); }
function icon_building(){ return '<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="3" width="16" height="18" rx="1" stroke="currentColor" stroke-width="1.7"/><path d="M8 7h2M13 7h2M8 11h2M13 11h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="9.5" y="15.5" width="4" height="5.5" stroke="#2f6bff" stroke-width="1.5"/></svg>'; }
function icon_plus(){ return '<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'; }
function icon_expand(){ return '<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 4v4H4M20 4v4h-4M8 20v-4H4M20 20v-4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function icon_collapse(){ return '<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function icon_edit(){ return '<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 20l1-4.5L15.5 5 19 8.5 8.5 19 4 20Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 7l4 4" stroke="#2f6bff" stroke-width="1.6"/></svg>'; }
function icon_transfer(){ return '<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 8h13M17 8l-3-3M17 8l-3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16H7M7 16l3 3M7 16l3-3" stroke="#2f6bff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function icon_check(){ return '<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12.5l4.5 4.5L19 7" stroke="#2f6bff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function icon_search(){ return '<svg class="ico" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-4.4-4.4" stroke="#2f6bff" stroke-width="1.9" stroke-linecap="round"/></svg>'; }

function renderOrgRow(org, depth, hasChildren, isExpanded, guideStack){
  const kids = opChildren(org.id);
  const lvl = LEVEL_META[org.level] || LEVEL_META[3];
  let guideHtml = '';
  for(let i=0;i<guideStack.length-1;i++){
    guideHtml += `<span class="tree-guide">${guideStack[i]?'&nbsp;':'│'}</span>`;
  }
  if(guideStack.length>0){
    const isLast = guideStack[guideStack.length-1];
    guideHtml += `<span class="tree-guide tree-guide-elbow">${isLast?'└':'├'}</span>`;
  }
  return `
  <tr style="cursor:pointer;" onclick="openOrgDetail('${org.id}')">
    <td>
      <div style="display:flex;align-items:center;">
        <span style="font-family:'Courier New',monospace;white-space:pre;">${guideHtml}</span>
        ${hasChildren ? `<span onclick="event.stopPropagation();opToggleExpand('${org.id}')" style="cursor:pointer;color:var(--bg-3);width:16px;display:inline-block;font-weight:700;">${isExpanded?'▾':'▸'}</span>` : `<span style="width:16px;display:inline-block;"></span>`}
        <div>
          <span style="font-weight:800;">${org.name}</span>
          <div class="tiny-note">${org.id} · MST ${org.mst} · ${org.unitType}</div>
        </div>
      </div>
    </td>
    <td><span class="status-pill ${lvl.cls}">${lvl.label}</span></td>
    <td style="text-align:center;">${opDirectStaffCount(org)}</td>
    <td style="text-align:center;">${kids.length || '—'}</td>
  </tr>`;
}
function opFlatCustRow(org, tab){
  const prog = (org.programs||[]).find(p=>p.status==='active');
  const progPill = prog
    ? `<span class="status-pill status-done">Đang hiệu lực</span>`
    : `<span class="status-pill status-cho">Chờ hoàn tất</span>`;
  const col2 = {
    individual: ()=> org.idNo || '—',
    nonbusiness: ()=> org.orgKind || org.unitType || '—',
    household: ()=> org.mst || '—',
    sales_officer: ()=> `${org.unit || '—'}${org.empId ? `<div class="tiny-note">${org.empId}</div>` : ''}`,
    agent_individual: ()=> `${org.certNo || '—'}${org.certExpiry ? `<div class="tiny-note">Hết hạn ${fmtDateVN(org.certExpiry)}</div>` : ''}`,
    collaborator: ()=> `${org.managerName || '—'}${org.managerId ? `<div class="tiny-note">${org.managerId}</div>` : ''}`,
    agent_org: ()=> `${org.orgKind || org.unitType || '—'}<div class="tiny-note">MST ${org.mst}</div>`,
  }[tab]();
  const sub = tab==='nonbusiness' ? (' · '+(org.orgCode||'—')) : tab==='individual' ? '' : (org.idNo ? ' · CCCD '+org.idNo : '');
  return `
  <tr style="cursor:pointer;" onclick="openOrgDetail('${org.id}')">
    <td>
      <div style="font-weight:800;">${org.name}</div>
      <div class="tiny-note">${org.id}${sub}</div>
    </td>
    <td>${col2}</td>
    <td>
      <div>${org.contact||'—'}</div>
      <div class="tiny-note">${org.phone||''}${org.email?(' · '+org.email):''}</div>
    </td>
    <td style="text-align:center;">${progPill}</td>
  </tr>`;
}
function opSetSearch(v){ S.orgPortal.search=v; render(); }
function opToggleExpand(id){ S.orgPortal.expanded[id] = !(S.orgPortal.expanded[id]!==false); render(); }
function opExpandAll(val){ opOrgs().forEach(o=>{ S.orgPortal.expanded[o.id]=val; }); render(); }
function opGoAddRootOrg(){ S.tab='kh'; openMoidForm(); }
function openOrgDetail(id){
  S.orgPortal.currentId=id; S.orgPortal.screen='detail'; S.orgPortal.detailTab='info'; S.orgPortal.editingInfo=false; S.orgPortal.selectedStaff={};
  const org = opFind(id);
  S.orgPortal.activeRole = org.roles[0]||null;
  S.orgPortal.rosterSearch=''; S.orgPortal.rosterPage=1; S.orgPortal.distSearch=''; S.orgPortal.distPage=1;
  render();
}
function backToOrgTree(){ S.orgPortal.screen='tree'; render(); }
function setOrgDetailTab(t){ S.orgPortal.detailTab=t; render(); }

function renderOrgDetail(){
  const org = opFind(S.orgPortal.currentId);
  const ancestors = opAncestors(org.id);
  const kids = opChildren(org.id);
  const leaf = leafOfOrg(org);
  const isPerson = leaf.entity==='canhan';
  const isSeller = leaf.role==='nb';

  const crumbChain = [
    `<a href="javascript:void(0)" onclick="backToOrgTree()" style="color:var(--bg-3);">Quản lý hồ sơ ${SUBJECT_ROLES[leaf.role].label.toLowerCase()}</a>`,
    `<span>${entityLabel(leaf.role,leaf.entity)} › ${leaf.short}</span>`,
    ...ancestors.map(a=>`<a href="javascript:void(0)" onclick="openOrgDetail('${a.id}')" style="color:var(--bg-3);">${a.name}</a>`),
    `<b>${org.name}</b>`,
  ];
  const breadcrumb = crumbChain.join(' <span style="color:var(--ink-faint);">/</span> ');
  const tab = S.orgPortal.detailTab;

  return `
  <div class="tiny-note" style="font-size:12.8px;margin-bottom:8px;">${breadcrumb}</div>
  <div class="page-title" style="margin-bottom:20px;"><span class="ico">${icon_building()}</span> ${org.name} <span class="chip" style="background:var(--info-bg);color:var(--bg-3);font-size:11px;">${org.id}</span></div>
  ${subjStrip(org)}

  <div class="filter-pills" style="margin-bottom:16px;">
    <div class="fpill ${tab==='info'?'active':''}" onclick="setOrgDetailTab('info')">📄 ${isPerson?'Hồ sơ cá nhân':'Hồ sơ pháp nhân'}</div>
    ${isSeller ? `<div class="fpill ${tab==='seller'?'active':''}" onclick="setOrgDetailTab('seller')">🤝 Hồ sơ người bán</div>` : ''}
    ${isPerson ? '' : `<div class="fpill ${tab==='relations'?'active':''}" onclick="setOrgDetailTab('relations')">🌿 Cơ cấu tổ chức (${kids.length})</div>
    <div class="fpill ${tab==='staff'?'active':''}" onclick="setOrgDetailTab('staff')">👤 Nhân sự trực thuộc (${opDirectStaffCount(org)})</div>`}
  </div>

  ${tab==='info' ? renderOrgInfoTab(org) : ''}
  ${tab==='info' && !isSeller ? renderKhSalesCard(org) : ''}
  ${tab==='seller' ? renderSellerRelCard(org) + renderSellerTab(org, leaf) : ''}
  ${tab==='relations' ? renderOrgRelationsTab(org, kids) : ''}
  ${tab==='staff' ? renderOrgStaffTab(org) : ''}

  <button class="btn btn-ghost" style="margin-top:18px;" onclick="backToOrgTree()">← Quay lại danh sách</button>
  `;
}
function renderSellerTab(org, leaf){
  const rows = org.seller || [];
  const prog = (org.programs||[])[0];
  return `
  <div class="card">
    <h3>🤝 Hồ sơ người bán — ${leaf.label}</h3>
    <p class="sub">Thông tin đặc thù theo template ${leaf.label}: ${leaf.sections.join(' · ')}.</p>
    ${prog && prog.status==='pending' && prog.pendingReason ? `<div class="notice warn">⏳ ${prog.pendingReason}</div>` : ''}
    <div style="border:1px solid var(--line);border-radius:14px;padding:6px 18px;font-size:12.8px;">
      ${rows.length ? rows.map((r,i)=>`<div style="display:flex;justify-content:space-between;gap:16px;padding:9px 0;${i<rows.length-1?'border-bottom:1px solid #f4f6fc;':''}"><span style="color:var(--ink-soft);">${r[0]}</span><b style="text-align:right;">${r[1]}</b></div>`).join('') : '<div class="empty-state">Chưa có dữ liệu hồ sơ người bán.</div>'}
    </div>
  </div>
  ${org.agent ? renderAgentSection(org) : ''}`;
}
function renderOrgInfoTab(org){
  const parent = org.parentId ? opFind(org.parentId) : null;
  const editing = S.orgPortal.editingInfo;
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div><h3>🏢 Hồ sơ pháp nhân</h3><p class="sub">Một pháp nhân tương ứng một Mã định danh Org ID duy nhất. Quan hệ với đơn vị chủ quản được ghi nhận qua trường "Đơn vị chủ quản".</p></div>
      ${editing
        ? `<button class="btn btn-success btn-sm" onclick="opSaveInfo('${org.id}')">${icon_check()} Lưu thay đổi</button>`
        : `<button class="btn btn-outline btn-sm" onclick="opToggleEditInfo()">${icon_edit()} Chỉnh sửa hồ sơ</button>`}
    </div>
    <div class="grid2">
      <div><label class="f-label">Mã số thuế</label><input class="input" value="${org.mst}" readonly></div>
      <div><label class="f-label">Tên đầy đủ theo Giấy phép ĐKKD</label><input class="input" id="oi-fullName" value="${org.fullName}" ${editing?'':'readonly'}></div>
